<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM Cube — K5 v7 · Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0d14; min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden; user-select: none;
            color: rgba(180,180,190,0.5);
        }
        #c { width: 600px; height: 600px; touch-action: none; cursor: default; }
        .hud { display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px; }
        .face-label { color:rgba(126,200,227,0.25);font-size:0.7rem;letter-spacing:0.2em; }
        .info-line { color:rgba(180,180,190,0.3);font-size:0.6rem;min-height:1.2em; }
        .hint { color:rgba(180,180,190,0.15);font-size:0.55rem; }
        .nav-dots { display:flex;gap:6px;margin-top:4px; }
        .nav-dot { width:7px;height:7px;border-radius:50%;background:rgba(126,200,227,0.12);transition:all 0.4s; }
        .nav-dot.active { background:rgba(126,200,227,0.6);box-shadow:0 0 7px rgba(126,200,227,0.4); }
        .dbtn { background:transparent;border:1px solid rgba(126,200,227,0.25);color:rgba(126,200,227,0.4);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.6rem;font-family:inherit;margin-top:8px; }
        .dbtn:hover { border-color:rgba(126,200,227,0.5);color:rgba(126,200,227,0.7); }
    </style>
</head>
<body>
    <canvas id="c" width="1200" height="1200"></canvas>
    <div class="hud">
        <div class="face-label" id="faceLabel">1 / 3</div>
        <div class="nav-dots" id="navDots"></div>
        <div class="info-line" id="infoLine"></div>
        <div class="hint">← → naviguer · tap bloquer · re-tap ancrer</div>
        <button class="dbtn" id="btnReset">reset</button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ═══ ICÔNES — dessin Canvas2D direct ═══
// Chaque fonction dessine dans un ctx, centré sur (cx,cy), taille ~sz
// Couleur néon cyan

function drawIcon(ctx, iconIdx, cx, cy, sz, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = sz * 0.08;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = sz * 0.25;
    const h = sz * 0.4, w = sz * 0.4;

    switch(iconIdx) {
        case 0: // wave
            ctx.beginPath();
            ctx.moveTo(cx-w, cy);
            ctx.quadraticCurveTo(cx-w*0.3, cy-h, cx, cy);
            ctx.quadraticCurveTo(cx+w*0.3, cy+h, cx+w, cy);
            ctx.stroke(); break;
        case 1: // triangle
            ctx.beginPath();
            ctx.moveTo(cx, cy-h); ctx.lineTo(cx+w, cy+h*0.7); ctx.lineTo(cx-w, cy+h*0.7); ctx.closePath();
            ctx.stroke(); break;
        case 2: // zigzag
            ctx.beginPath();
            ctx.moveTo(cx-w, cy+h*0.5); ctx.lineTo(cx-w*0.33, cy-h*0.5);
            ctx.lineTo(cx+w*0.33, cy+h*0.5); ctx.lineTo(cx+w, cy-h*0.5);
            ctx.stroke(); break;
        case 3: // circle
            ctx.beginPath();
            ctx.arc(cx, cy, sz*0.28, 0, Math.PI*2);
            ctx.stroke(); break;
        case 4: // dot1
            ctx.beginPath();
            ctx.arc(cx, cy, sz*0.12, 0, Math.PI*2);
            ctx.fill(); break;
        case 5: // dot3
            ctx.beginPath(); ctx.arc(cx, cy-h*0.5, sz*0.09, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx-w*0.55, cy+h*0.45, sz*0.09, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+w*0.55, cy+h*0.45, sz*0.09, 0, Math.PI*2); ctx.fill();
            break;
        case 6: // diamond
            ctx.beginPath();
            ctx.moveTo(cx, cy-h); ctx.lineTo(cx+w, cy); ctx.lineTo(cx, cy+h); ctx.lineTo(cx-w, cy); ctx.closePath();
            ctx.stroke(); break;
        case 7: // cross
            ctx.beginPath(); ctx.moveTo(cx, cy-h); ctx.lineTo(cx, cy+h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-w, cy); ctx.lineTo(cx+w, cy); ctx.stroke();
            break;
        case 8: // roof
            ctx.beginPath();
            ctx.moveTo(cx-w, cy+h*0.5); ctx.lineTo(cx, cy-h*0.5); ctx.lineTo(cx+w, cy+h*0.5);
            ctx.stroke(); break;
        case 9: // arc
            ctx.beginPath();
            ctx.moveTo(cx-w, cy+h*0.4);
            ctx.quadraticCurveTo(cx, cy-h*0.7, cx+w, cy+h*0.4);
            ctx.stroke(); break;
        case 10: // hex
            ctx.beginPath();
            for(let i=0;i<6;i++){const a=Math.PI/2+i*Math.PI/3;ctx.lineTo(cx+Math.cos(a)*sz*0.28,cy-Math.sin(a)*sz*0.28);}
            ctx.closePath(); ctx.stroke(); break;
        case 11: // eye
            ctx.beginPath();
            ctx.moveTo(cx-w, cy); ctx.quadraticCurveTo(cx, cy-h, cx+w, cy);
            ctx.quadraticCurveTo(cx, cy+h, cx-w, cy);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, sz*0.08, 0, Math.PI*2); ctx.fill();
            break;
        case 12: // spiral
            ctx.beginPath();
            ctx.arc(cx, cy, sz*0.1, 0, Math.PI*1.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, sz*0.22, Math.PI*1.5, Math.PI*0.2, true);
            ctx.stroke();
            break;
        case 13: // 3 lines
            ctx.beginPath(); ctx.moveTo(cx-w*0.5, cy-h); ctx.lineTo(cx-w*0.5, cy+h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy-h); ctx.lineTo(cx, cy+h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx+w*0.5, cy-h); ctx.lineTo(cx+w*0.5, cy+h); ctx.stroke();
            break;
        case 14: // dot4
            const dd = sz*0.18;
            ctx.beginPath(); ctx.arc(cx-dd, cy-dd, sz*0.08, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+dd, cy-dd, sz*0.08, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx-dd, cy+dd, sz*0.08, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+dd, cy+dd, sz*0.08, 0, Math.PI*2); ctx.fill();
            break;
        case 15: // twocir
            ctx.beginPath(); ctx.arc(cx-sz*0.14, cy, sz*0.15, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx+sz*0.14, cy, sz*0.15, 0, Math.PI*2); ctx.stroke();
            break;
    }
    ctx.restore();
}

// ═══ DOMINO TEXTURE — médiane verticale, néon, tout Canvas2D ═══

const _dtc = {};
function getDominoTex(leftIdx, rightIdx, tint) {
    const k = leftIdx+'|'+rightIdx+'|'+tint;
    if (_dtc[k]) return _dtc[k];

    const S = 512;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d');

    // Couleurs selon tint
    const border = tint==='cyan' ? 'rgba(126,200,227,0.9)' : tint==='gold' ? 'rgba(255,215,0,0.7)' : 'rgba(126,200,227,0.5)';
    const sep    = tint==='cyan' ? 'rgba(126,200,227,0.6)' : tint==='gold' ? 'rgba(255,215,0,0.4)' : 'rgba(126,200,227,0.3)';
    const iconC  = tint==='cyan' ? '#5eefff' : tint==='gold' ? '#ffd700' : '#7ec8e3';
    const glow   = tint==='cyan' ? 'rgba(94,239,255,0.3)' : tint==='gold' ? 'rgba(255,215,0,0.15)' : 'rgba(126,200,227,0.12)';

    // Fond arrondi
    const r = 36, m = 8;
    ctx.fillStyle = '#0e0f18';
    ctx.beginPath();
    ctx.moveTo(m+r, m); ctx.lineTo(S-m-r, m); ctx.quadraticCurveTo(S-m, m, S-m, m+r);
    ctx.lineTo(S-m, S-m-r); ctx.quadraticCurveTo(S-m, S-m, S-m-r, S-m);
    ctx.lineTo(m+r, S-m); ctx.quadraticCurveTo(m, S-m, m, S-m-r);
    ctx.lineTo(m, m+r); ctx.quadraticCurveTo(m, m, m+r, m);
    ctx.closePath(); ctx.fill();

    // Glow interne
    ctx.shadowColor = glow; ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bordure néon
    ctx.strokeStyle = border; ctx.lineWidth = 3;
    ctx.shadowColor = border; ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Séparateur vertical (médiane)
    ctx.strokeStyle = sep; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(S/2, m+30); ctx.lineTo(S/2, S-m-30); ctx.stroke();

    // Icônes — gauche et droite
    const iconSz = S * 0.42;
    drawIcon(ctx, leftIdx,  S*0.25, S*0.5, iconSz, iconC);
    drawIcon(ctx, rightIdx, S*0.75, S*0.5, iconSz, iconC);

    const tex = new THREE.CanvasTexture(cv);
    _dtc[k] = tex;
    return tex;
}

// ═══ TABLEAUX ═══

const GAP = 1.15;
const TABLEAUX = [
    { name:'T1', sats:[ {x:0, y:GAP, v:[0,5]}, {x:0, y:-GAP, v:[2,3]} ] },
    { name:'T2', sats:[ {x:-GAP, y:0, v:[6,4]}, {x:GAP, y:0, v:[8,1]} ] },
    { name:'T3', sats:[
        {x:-2*GAP, y:GAP, v:[10,7]}, {x:-2*GAP, y:0, v:[9,4]},
        {x:-GAP, y:-GAP, v:[11,2]}, {x:GAP, y:-GAP, v:[12,5]},
        {x:2*GAP, y:GAP, v:[13,6]}, {x:2*GAP, y:0, v:[14,3]}, {x:2*GAP, y:-GAP, v:[15,0]}
    ] },
];
const TOTAL = TABLEAUX.length;

// ═══ CONFIG ═══

const HALF = 0.52;
const CAM_Z = 18;

function camTargetFor(tIdx){
    let cx=0,mxX=0,mxY=0,count=0;
    sats.forEach(s=>{
        if(s.tableau===tIdx&&!s.locked){
            cx+=s.lx;
            mxX=Math.max(mxX,Math.abs(s.lx));mxY=Math.max(mxY,Math.abs(s.ly));
            count++;
        }
    });
    if(count===0) return camTargetForStatic(tIdx);
    cx/=count;
    const w=(mxX+0.5)*1.2, h=mxY+0.5;
    return {x:cx*0.5, z:1.35+Math.max(w,h)*5.85};
}
function camTargetForStatic(tIdx){
    const tab=TABLEAUX[tIdx]; if(!tab)return {x:0,z:CAM_Z};
    let cx=0,mxX=0,mxY=0;
    tab.sats.forEach(s=>{cx+=s.x;mxX=Math.max(mxX,Math.abs(s.x));mxY=Math.max(mxY,Math.abs(s.y));});
    cx/=tab.sats.length;
    const w=(mxX+0.5)*1.2, h=mxY+0.5;
    return {x:cx*0.5, z:1.35+Math.max(w,h)*5.85};
}

let targetCamX=0;
function refreshZoom(){
    const t=camTargetFor(mod(currentIdx));
    targetCamX=t.x;targetCamZ=t.z;
}

const FACE_ROT=[0, Math.PI/2, Math.PI, -Math.PI/2];

// ═══ THREE SETUP ═══

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(600,600);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x0c0d14);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
const initCam=camTargetForStatic(0);
camera.position.set(initCam.x,0,initCam.z);camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff,0.8));

// ═══ HELPERS ═══

function rrShape(w,h,r){
    const s=new THREE.Shape(),hw=w/2,hh=h/2;
    s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);
    s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);
    s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);
    s.quadraticCurveTo(-hw,hh,-hw,hh-r);s.lineTo(-hw,-hh+r);
    s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;
}

function placeSat(sat,faceRotY){
    const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),faceRotY);
    sat.mesh.position.copy(new THREE.Vector3(sat.lx,sat.ly,HALF+0.01).applyQuaternion(q));
    sat.mesh.quaternion.copy(q);
}

// ═══ PORTE ═══

let porteValue=[7,8];
const cubeGroup=new THREE.Group();scene.add(cubeGroup);

function makePorteTex(val){ return getDominoTex(val[0], val[1], 'normal'); }
const cubeMats=[];for(let i=0;i<6;i++)cubeMats.push(new THREE.MeshBasicMaterial({map:makePorteTex(porteValue),transparent:true}));
const cubeMesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),cubeMats);cubeMesh.userData.isCube=true;cubeGroup.add(cubeMesh);
function updatePorte(val){porteValue=val;const tex=makePorteTex(val);cubeMats.forEach(m=>{m.map=tex;m.needsUpdate=true;});}

// ═══ SATELLITES — un seul plane texturé, pas de double carré ═══

const sats=[];
function createSatMesh(value){
    const grp=new THREE.Group(), SZ=1.0, R=0.12;
    // Plane unique avec la texture domino (fond+bordure+icônes intégrés)
    const nMesh=new THREE.Mesh(
        new THREE.PlaneGeometry(SZ, SZ),
        new THREE.MeshBasicMaterial({map:getDominoTex(value[0],value[1],'normal'),transparent:true})
    );
    grp.add(nMesh);
    // Glow (derrière)
    const gShape=rrShape(SZ+0.06,SZ+0.06,R+0.03);
    const gMesh=new THREE.Mesh(new THREE.ShapeGeometry(gShape),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));
    gMesh.position.z=-0.005;grp.add(gMesh);
    // Halo
    const hMesh=new THREE.Mesh(new THREE.ShapeGeometry(rrShape(SZ+0.2,SZ+0.2,R+0.08)),new THREE.MeshBasicMaterial({color:0x7ec8e3,transparent:true,opacity:0}));
    hMesh.position.z=-0.01;grp.add(hMesh);
    grp.userData={numMesh:nMesh,glowMesh:gMesh,haloMesh:hMesh,isSat:true};return grp;
}

TABLEAUX.forEach((tab,tIdx)=>{tab.sats.forEach((sd,sIdx)=>{
    const mesh=createSatMesh(sd.v);mesh.visible=false;cubeGroup.add(mesh);
    sats.push({id:tIdx*100+sIdx,value:sd.v,tableau:tIdx,origTableau:tIdx,lx:sd.x,ly:sd.y,origLx:sd.x,origLy:sd.y,locked:false,mesh});
});});

// ═══ STATE ═══

let lockedSat=null,currentIdx=0,busy=false,isAnimating=false,navDir=0;
let targetCamZ=camTargetForStatic(0).z;
const targetQuat=new THREE.Quaternion();
function mod(n){return((n%TOTAL)+TOTAL)%TOTAL;}

// ═══ ASSIGN ═══

function assignFaces(){
    const faceMap=[[mod(currentIdx),0],[mod(currentIdx+1),1],[mod(currentIdx-1),3]];
    sats.forEach(sat=>{
        if(sat.locked)return;
        const entry=faceMap.find(f=>f[0]===sat.tableau);
        if(entry){placeSat(sat,FACE_ROT[entry[1]]);if(sat.mesh.parent!==cubeGroup)cubeGroup.attach(sat.mesh);}
    });
}

// ═══ NAV ═══

function navRight(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=1;
    targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2);
    const t=camTargetFor(mod(currentIdx+1));targetCamX=t.x;targetCamZ=t.z;
    const show=[mod(currentIdx),mod(currentIdx+1)];
    sats.forEach(s=>{if(!s.locked&&show.includes(s.tableau))s.mesh.visible=true;});
}
function navLeft(){
    if(busy||isAnimating)return;busy=true;isAnimating=true;navDir=-1;
    targetQuat.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);
    const t=camTargetFor(mod(currentIdx-1));targetCamX=t.x;targetCamZ=t.z;
    const show=[mod(currentIdx),mod(currentIdx-1)];
    sats.forEach(s=>{if(!s.locked&&show.includes(s.tableau))s.mesh.visible=true;});
}
function onRotationComplete(){
    currentIdx=mod(currentIdx+navDir);cubeGroup.quaternion.identity();targetQuat.identity();navDir=0;
    assignFaces();isAnimating=false;busy=false;updateUI();
}

// ═══ TAP ═══

function tapLock(sat){
    if(busy||isAnimating)return;if(lockedSat)tapRelease(lockedSat);
    sat.locked=true;lockedSat=sat;sat.srcTableau=sat.tableau;sat.srcLx=sat.lx;sat.srcLy=sat.ly;
    scene.attach(sat.mesh);refreshZoom();updateUI();
}
function tapRelease(sat){
    if(!sat.locked)return;
    if(isAnimating||busy)return;
    const wp=new THREE.Vector3();sat.mesh.getWorldPosition(wp);
    cubeGroup.attach(sat.mesh);
    const fIdx=mod(currentIdx);
    const lp=cubeGroup.worldToLocal(wp.clone());
    const lx=lp.x,ly=lp.y;
    let closest=null,cd=Infinity;
    for(const o of sats){if(o===sat||o.locked||o.tableau!==fIdx)continue;const d=Math.hypot(o.lx-lx,o.ly-ly);if(d<cd){cd=d;closest=o;}}
    if(closest&&cd<GAP*0.9){
        const cT=closest.tableau,cX=closest.lx,cY=closest.ly;
        sat.tableau=cT;sat.lx=cX;sat.ly=cY;placeSat(sat,FACE_ROT[0]);sat.mesh.scale.set(1,1,1);
        closest.tableau=sat.srcTableau;closest.lx=sat.srcLx;closest.ly=sat.srcLy;placeSat(closest,FACE_ROT[0]);
    } else {sat.tableau=fIdx;sat.lx=lx;sat.ly=ly;placeSat(sat,FACE_ROT[0]);sat.mesh.scale.set(1,1,1);}
    sat.locked=false;lockedSat=null;assignFaces();refreshZoom();updateUI();
}

// ═══ DRAG SWAP ═══

let swapAnim=null;

function dragSwap(sat, dirX, dirY){
    if(!sat||sat.locked||busy||isAnimating||swapAnim)return false;
    const fIdx=mod(currentIdx);
    if(sat.tableau!==fIdx)return false;
    const tx=sat.lx+dirX*GAP, ty=sat.ly+dirY*GAP;

    const target=sats.find(s=>s!==sat&&!s.locked&&s.tableau===fIdx&&Math.abs(s.lx-tx)<0.1&&Math.abs(s.ly-ty)<0.1);
    if(target){
        const aFrom={x:sat.lx,y:sat.ly}, bFrom={x:target.lx,y:target.ly};
        sat.lx=bFrom.x;sat.ly=bFrom.y;target.lx=aFrom.x;target.ly=aFrom.y;
        swapAnim={pairs:[
            {mesh:sat.mesh, from:aFrom, to:bFrom},
            {mesh:target.mesh, from:bFrom, to:aFrom},
        ], t:0};
        return true;
    }
    if(Math.abs(tx)<0.1&&Math.abs(ty)<0.1){
        const old=porteValue;
        const aFrom={x:sat.lx,y:sat.ly};
        updatePorte(sat.value);
        sat.value=old;
        sat.mesh.userData.numMesh.material.map=getDominoTex(old[0],old[1],'normal');
        swapAnim={pairs:[
            {mesh:sat.mesh, from:aFrom, to:{x:0,y:0}, bounce:true, finalPos:aFrom},
        ], t:0, isPorte:true};
        return true;
    }
    return false;
}

function tickSwapAnim(dt){
    if(!swapAnim)return;
    swapAnim.t+=dt*4;
    const p=Math.min(1, swapAnim.t);
    const ease=p<0.5?2*p*p:(1-Math.pow(-2*p+2,2)/2);
    if(swapAnim.isPorte){
        const pp=p<0.5?p*2:(2-p*2);
        const ep=pp<0.5?2*pp*pp:(1-Math.pow(-2*pp+2,2)/2);
        swapAnim.pairs.forEach(pair=>{
            pair.mesh.position.x=pair.from.x+(0-pair.from.x)*ep;
            pair.mesh.position.y=pair.from.y+(0-pair.from.y)*ep;
        });
    } else {
        swapAnim.pairs.forEach(pair=>{
            pair.mesh.position.x=pair.from.x+(pair.to.x-pair.from.x)*ease;
            pair.mesh.position.y=pair.from.y+(pair.to.y-pair.from.y)*ease;
        });
    }
    if(p>=1){
        swapAnim.pairs.forEach(pair=>{
            const sat=sats.find(s=>s.mesh===pair.mesh);
            if(sat&&!sat.locked) placeSat(sat,FACE_ROT[0]);
        });
        assignFaces();swapAnim=null;refreshZoom();updateUI();
    }
}

// ═══ RAYCAST ═══

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function getSatAt(cx,cy){
    const r=canvas.getBoundingClientRect();mouse.x=((cx-r.left)/r.width)*2-1;mouse.y=-((cy-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);const all=[];
    sats.forEach(s=>{if(s.mesh.visible)s.mesh.traverse(c=>{if(c.isMesh)all.push(c);});});
    for(const h of raycaster.intersectObjects(all,false)){let o=h.object;while(o){if(o.userData&&o.userData.isSat){const s=sats.find(x=>x.mesh===o);if(s)return s;}o=o.parent;}}return null;
}

// ═══ POINTER ═══

let pStart=null,pMoved=false,pSat=null;
canvas.addEventListener('pointerdown',e=>{pStart={x:e.clientX,y:e.clientY};pMoved=false;pSat=getSatAt(e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(pStart&&Math.hypot(e.clientX-pStart.x,e.clientY-pStart.y)>10)pMoved=true;});
canvas.addEventListener('pointerup',e=>{
    if(!pStart)return;const dx=e.clientX-pStart.x,dy=e.clientY-pStart.y,dist=Math.hypot(dx,dy);
    if(!pMoved){
        const sat=getSatAt(e.clientX,e.clientY);
        if(sat){if(sat.locked)tapRelease(sat);else tapLock(sat);}
        else if(lockedSat)tapRelease(lockedSat);
    } else if(dist>=15){
        if(pSat&&!pSat.locked){
            let dirX=0,dirY=0;
            if(Math.abs(dx)>Math.abs(dy)){dirX=dx>0?1:-1;}
            else{dirY=dy>0?-1:1;}
            if(dragSwap(pSat,dirX,dirY)){pStart=null;pSat=null;return;}
        }
        if(Math.abs(dx)>=Math.abs(dy)){dx>0?navRight():navLeft();}
    }
    pStart=null;pSat=null;
});
canvas.addEventListener('pointercancel',()=>{pStart=null;pSat=null;});

// ═══ WHEEL + KEY ═══

let wx=0,wcd=false,wt=null;
canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    if(wcd||busy||isAnimating)return;
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    wx+=d;
    clearTimeout(wt);wt=setTimeout(()=>{wx=0;},100);
    if(Math.abs(wx)>50){
        wx>0?navRight():navLeft();
        wx=0;wcd=true;setTimeout(()=>{wcd=false;},600);
    }
},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){navRight();e.preventDefault();}else if(e.key==='ArrowLeft'){navLeft();e.preventDefault();}});

// ═══ UI ═══

const dotsEl=document.getElementById('navDots');
for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='nav-dot'+(i===0?' active':'');dotsEl.appendChild(d);}
function updateUI(){
    const idx=mod(currentIdx);document.getElementById('faceLabel').textContent=`${idx+1} / ${TOTAL}`;
    dotsEl.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
    const c=sats.filter(s=>s.tableau===idx&&!s.locked).length;
    let t=`T${idx+1} [porte] · ${c} sat${c>1?'s':''}`;if(lockedSat)t+=` · ⟐ flotte`;
    document.getElementById('infoLine').textContent=t;
}

// ═══ RESET ═══

document.getElementById('btnReset').addEventListener('click',()=>{
    if(lockedSat){cubeGroup.attach(lockedSat.mesh);lockedSat.locked=false;}lockedSat=null;
    let si=0;TABLEAUX.forEach((tab,tIdx)=>{tab.sats.forEach(sd=>{
        const sat=sats[si++];sat.value=sd.v;sat.tableau=tIdx;sat.origTableau=tIdx;
        sat.lx=sd.x;sat.ly=sd.y;sat.origLx=sd.x;sat.origLy=sd.y;sat.locked=false;
        if(sat.mesh.parent!==cubeGroup)cubeGroup.attach(sat.mesh);sat.mesh.scale.set(1,1,1);
        const ud=sat.mesh.userData;ud.glowMesh.material.opacity=0;ud.haloMesh.material.opacity=0;
        ud.numMesh.material.map=getDominoTex(sd.v[0],sd.v[1],'normal');
    });});
    updatePorte([7,8]);cubeGroup.quaternion.identity();targetQuat.identity();
    currentIdx=0;isAnimating=false;busy=false;navDir=0;
    refreshZoom();camera.position.set(targetCamX,0,targetCamZ);assignFaces();updateUI();
});

// ═══ RENDER ═══

const clock=new THREE.Clock();
let lastTime=0;
function animate(){
    requestAnimationFrame(animate);const t=clock.getElapsedTime();const dt=t-lastTime;lastTime=t;
    if(isAnimating){cubeGroup.quaternion.slerp(targetQuat,0.12);
        if(1-Math.abs(cubeGroup.quaternion.dot(targetQuat))<0.0001){cubeGroup.quaternion.copy(targetQuat);onRotationComplete();}}
    tickSwapAnim(dt);
    camera.position.x+=(targetCamX-camera.position.x)*0.1;
    camera.position.z+=(targetCamZ-camera.position.z)*0.1;
    camera.lookAt(camera.position.x*0.8, 0, 0);
    const fIdx=mod(currentIdx);
    sats.forEach(sat=>{const ud=sat.mesh.userData;
        if(sat.locked){sat.mesh.visible=true;const p=0.5+0.5*Math.sin(t*3.5);
            ud.glowMesh.material.opacity=0.2+p*0.35;ud.haloMesh.material.opacity=0.05+p*0.1;
            ud.numMesh.material.map=getDominoTex(sat.value[0],sat.value[1],'cyan');
        } else {
            if(!isAnimating)sat.mesh.visible=(sat.tableau===fIdx);
            ud.glowMesh.material.opacity=0;ud.haloMesh.material.opacity=0;
            const foreign=sat.tableau!==sat.origTableau;
            ud.numMesh.material.map=getDominoTex(sat.value[0],sat.value[1],foreign?'gold':'normal');
        }
    });
    renderer.render(scene,camera);
}
assignFaces();updateUI();animate();
</script>
</body>
</html>
