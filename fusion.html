<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADAM - v26 Directional Fusion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background-color: #12131a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .undo-button {
            background: rgba(40, 42, 54, 0.6);
            border: 1px solid rgba(180, 180, 190, 0.3);
            border-radius: 8px;
            color: rgba(180, 180, 190, 0.7);
            font-size: 12px;
            font-weight: 500;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .undo-button:hover {
            background: rgba(50, 52, 64, 0.8);
            border-color: rgba(180, 180, 190, 0.5);
            color: rgba(220, 220, 230, 0.9);
        }
        
        .undo-button:active {
            transform: scale(0.95);
        }
        
        .undo-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .undo-button.active {
            border-color: rgba(255, 215, 0, 0.7);
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 
                        inset 0 0 20px rgba(255, 215, 0, 0.05);
        }
        
        .buttons-container {
            display: flex;
            gap: 10px;
        }
        
        /* ========== GRILLE AVEC MASKING ========== */
        .grid-wrapper {
            position: relative;
            --cell: min(80px, 18vw);
            --gap: 10px;
            width: calc(4 * var(--cell) + 3 * var(--gap));
            height: calc(5 * var(--cell) + 4 * var(--gap));
            overflow: hidden; /* LE MASQUE MAGIQUE */
        }
        
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .square {
            width: var(--cell);
            height: var(--cell);
            background-color: #12131a;
            border: 1px solid rgba(180, 180, 190, 0.35);
            border-radius: 14px;
            position: absolute;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        
        .square:hover {
            border-color: rgba(180, 180, 190, 0.55);
        }
        
        .square:active {
            cursor: grabbing;
        }
        
        .square.empty {
            cursor: default;
            border: 1px dashed rgba(180, 180, 190, 0.15);
            border-radius: 14px;
            background-color: #12131a;
        }
        
        .square.white-border {
            cursor: grab;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            background-color: #12131a;
        }
        
        .square.ghost {
            pointer-events: none;
            opacity: 0.9;
        }
        
        @keyframes fusionPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .fusion-animation {
            animation: fusionPulse 0.4s ease-in-out;
        }
        
        /* Animation de bascule : gérée en JS pour combiner avec la rotation existante */
        
        /* Animation de scission */
        @keyframes splitPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }
        
        .split-animation {
            animation: splitPulse 0.3s ease-out;
        }
        
        @keyframes splitFly {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .split-fly-animation {
            animation: splitFly 0.4s ease-out;
        }
        
        /* Feedback échec scission */
        @keyframes splitFail {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .split-fail {
            animation: splitFail 0.4s ease-out;
            border-color: rgba(255, 100, 100, 0.7) !important;
        }
        
        /* Indicateur long press */
        @keyframes longPressGlow {
            0% { box-shadow: inset 0 0 0 0 rgba(255, 215, 0, 0); }
            100% { box-shadow: inset 0 0 20px 5px rgba(255, 215, 0, 0.4); }
        }
        
        .long-press-indicator {
            animation: longPressGlow 0.5s ease-out forwards;
        }
        
        .square svg {
            width: 100%;
            height: 100%;
        }
        
        svg .separator {
            stroke: rgba(180, 180, 190, 0.3);
            stroke-width: 1;
        }
        
        svg line.icon,
        svg path.icon,
        svg circle.icon,
        svg rect.icon {
            stroke: rgba(180, 180, 190, 0.35);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        
        svg circle.point {
            fill: rgba(180, 180, 190, 0.35);
        }
        
        /* === ÉTATS PAR FACE INDIVIDUELLE === */
        
        /* Face1 states */
        .face1-white line.icon, .face1-white path.icon, 
        .face1-white circle.icon, .face1-white rect.icon {
            stroke: rgba(180, 180, 190, 0.35);
        }
        .face1-white circle.point {
            fill: rgba(180, 180, 190, 0.35);
        }
        
        .face1-silver line.icon, .face1-silver path.icon, 
        .face1-silver circle.icon, .face1-silver rect.icon {
            stroke: #22d3ee;
            filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4));
        }
        .face1-silver circle.point {
            fill: #22d3ee;
            filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4));
        }
        
        .face1-gold line.icon, .face1-gold path.icon, 
        .face1-gold circle.icon, .face1-gold rect.icon {
            stroke: #ffd700;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        .face1-gold circle.point {
            fill: #ffd700;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        
        .face1-emerald line.icon, .face1-emerald path.icon, 
        .face1-emerald circle.icon, .face1-emerald rect.icon {
            stroke: #34d399;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.9));
        }
        .face1-emerald circle.point {
            fill: #34d399;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.9));
        }
        
        .face1-cosmic line.icon, .face1-cosmic path.icon, 
        .face1-cosmic circle.icon, .face1-cosmic rect.icon {
            stroke: #c4b5fd;
            filter: drop-shadow(0 0 6px rgba(131, 56, 236, 0.7)) drop-shadow(0 0 10px rgba(255, 0, 110, 0.4));
            animation: cosmicIconShift 3s ease-in-out infinite;
        }
        .face1-cosmic circle.point {
            fill: #c4b5fd;
            filter: drop-shadow(0 0 6px rgba(131, 56, 236, 0.7));
            animation: cosmicPointPulse 1.5s ease-in-out infinite;
        }
        
        /* Face2 states */
        .face2-white line.icon, .face2-white path.icon, 
        .face2-white circle.icon, .face2-white rect.icon {
            stroke: rgba(180, 180, 190, 0.35);
        }
        .face2-white circle.point {
            fill: rgba(180, 180, 190, 0.35);
        }
        
        .face2-silver line.icon, .face2-silver path.icon, 
        .face2-silver circle.icon, .face2-silver rect.icon {
            stroke: #22d3ee;
            filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4));
        }
        .face2-silver circle.point {
            fill: #22d3ee;
            filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4));
        }
        
        .face2-gold line.icon, .face2-gold path.icon, 
        .face2-gold circle.icon, .face2-gold rect.icon {
            stroke: #ffd700;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        .face2-gold circle.point {
            fill: #ffd700;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6));
        }
        
        .face2-emerald line.icon, .face2-emerald path.icon, 
        .face2-emerald circle.icon, .face2-emerald rect.icon {
            stroke: #34d399;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.9));
        }
        .face2-emerald circle.point {
            fill: #34d399;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.9));
        }
        
        .face2-cosmic line.icon, .face2-cosmic path.icon, 
        .face2-cosmic circle.icon, .face2-cosmic rect.icon {
            stroke: #c4b5fd;
            filter: drop-shadow(0 0 6px rgba(131, 56, 236, 0.7)) drop-shadow(0 0 10px rgba(255, 0, 110, 0.4));
            animation: cosmicIconShift 3s ease-in-out infinite;
        }
        .face2-cosmic circle.point {
            fill: #c4b5fd;
            filter: drop-shadow(0 0 6px rgba(131, 56, 236, 0.7));
            animation: cosmicPointPulse 1.5s ease-in-out infinite;
        }
        
        /* Face supernovae */
        .face1-supernovae line.icon, .face1-supernovae path.icon, 
        .face1-supernovae circle.icon, .face1-supernovae rect.icon {
            stroke: #ffeb3b;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 10px rgba(255, 140, 0, 0.4));
            animation: supernovaIconShift 2.5s ease-in-out infinite;
        }
        .face1-supernovae circle.point {
            fill: #ffeb3b;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7));
            animation: supernovaPointPulse 1.2s ease-in-out infinite;
        }
        .face2-supernovae line.icon, .face2-supernovae path.icon, 
        .face2-supernovae circle.icon, .face2-supernovae rect.icon {
            stroke: #ffeb3b;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 10px rgba(255, 140, 0, 0.4));
            animation: supernovaIconShift 2.5s ease-in-out infinite;
        }
        .face2-supernovae circle.point {
            fill: #ffeb3b;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7));
            animation: supernovaPointPulse 1.2s ease-in-out infinite;
        }
        
        /* ============================================ */
        /* HALOS POUR DOMINOS UNIQUES (.square.unique) */
        /* ============================================ */
        
        .square.unique.white { 
            border-color: rgba(180, 180, 190, 0.35); 
        }
        
        .square.unique.silver { 
            border-color: rgba(6, 182, 212, 0.6); 
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2), 
                        inset 0 0 15px rgba(6, 182, 212, 0.05); 
        }
        
        .square.unique.gold { 
            border-color: rgba(255, 215, 0, 0.7); 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 
                        inset 0 0 20px rgba(255, 215, 0, 0.05); 
        }
        
        .square.unique.emerald { 
            border-color: rgba(52, 211, 153, 0.9); 
            box-shadow: 0 0 25px rgba(5, 150, 105, 0.5), 
                        0 0 40px rgba(52, 211, 153, 0.3), 
                        inset 0 0 25px rgba(52, 211, 153, 0.1); 
            animation: emeraldGlow 2.5s ease-in-out infinite; 
        }
        
        @property --cosmic-angle { 
            syntax: '<angle>'; 
            initial-value: 0deg; 
            inherits: false; 
        }
        .square.unique.cosmic { 
            border: 2px solid transparent; 
            background: linear-gradient(#12131a, #12131a) padding-box, 
                        conic-gradient(from var(--cosmic-angle, 0deg), 
                            #ff006e, #8338ec, #06b6d4, #34d399, #ffd700, #ff006e) border-box; 
            box-shadow: 0 0 25px rgba(131, 56, 236, 0.4), 
                        0 0 40px rgba(255, 0, 110, 0.2), 
                        0 0 50px rgba(6, 182, 212, 0.2), 
                        inset 0 0 30px rgba(131, 56, 236, 0.1); 
            animation: cosmicRotate 4s linear infinite, 
                       cosmicPulse 2s ease-in-out infinite; 
        }
        
        @property --supernova-angle { 
            syntax: '<angle>'; 
            initial-value: 0deg; 
            inherits: false; 
        }
        .square.unique.supernovae { 
            border: 3px solid transparent; 
            background: linear-gradient(#12131a, #12131a) padding-box, 
                        conic-gradient(from var(--supernova-angle, 0deg), 
                            #ff4500, #ff8c00, #ffd700, #ffff00, #ff8c00, #ff4500) border-box; 
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.4), 
                        0 0 40px rgba(255, 69, 0, 0.2), 
                        0 0 50px rgba(255, 215, 0, 0.2), 
                        inset 0 0 30px rgba(255, 140, 0, 0.1); 
            animation: supernovaRotate 3s linear infinite, 
                       supernovaPulse 1.5s ease-in-out infinite; 
        }
        
        /* ============================================ */
        /* HALOS POUR DOMINOS DOUBLES (zones clippées) */
        /* ============================================ */
        
        .square.double {
            border-color: rgba(180, 180, 190, 0.35);
            overflow: visible; /* Permet aux halos de déborder */
        }
        
        .halo-zone {
            position: absolute;
            left: -1px;
            right: -1px;
            pointer-events: none;
            z-index: -1;
        }
        
        .halo-zone.top {
            top: -1px;
            height: 50%;
            border-radius: 14px 14px 0 0;
            clip-path: inset(0 0 0 0);
        }
        
        .halo-zone.bottom {
            bottom: -1px;
            height: 50%;
            border-radius: 0 0 14px 14px;
            clip-path: inset(0 0 0 0);
        }
        
        /* États des zones de halo */
        .halo-zone.white {
            border: 1px solid rgba(180, 180, 190, 0.35);
        }
        .halo-zone.top.white { border-bottom: none; }
        .halo-zone.bottom.white { border-top: none; }
        
        .halo-zone.silver {
            border: 1px solid rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.3), 
                        inset 0 0 15px rgba(6, 182, 212, 0.08);
        }
        .halo-zone.top.silver { border-bottom: none; }
        .halo-zone.bottom.silver { border-top: none; }
        
        .halo-zone.gold {
            border: 1px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), 
                        inset 0 0 20px rgba(255, 215, 0, 0.08);
        }
        .halo-zone.top.gold { border-bottom: none; }
        .halo-zone.bottom.gold { border-top: none; }
        
        .halo-zone.emerald {
            border: 1px solid rgba(52, 211, 153, 0.9);
            box-shadow: 0 0 25px rgba(5, 150, 105, 0.6), 
                        0 0 40px rgba(52, 211, 153, 0.4),
                        inset 0 0 25px rgba(52, 211, 153, 0.12);
            animation: emeraldGlowZone 2.5s ease-in-out infinite;
        }
        .halo-zone.top.emerald { border-bottom: none; }
        .halo-zone.bottom.emerald { border-top: none; }
        
        .halo-zone.cosmic {
            border: 2px solid transparent;
            background: linear-gradient(#12131a, #12131a) padding-box, 
                        conic-gradient(from var(--cosmic-angle, 0deg), 
                            #ff006e, #8338ec, #06b6d4, #34d399, #ffd700, #ff006e) border-box;
            box-shadow: 0 0 25px rgba(131, 56, 236, 0.5), 
                        0 0 40px rgba(255, 0, 110, 0.3),
                        inset 0 0 30px rgba(131, 56, 236, 0.12);
            animation: cosmicRotate 4s linear infinite, cosmicPulseZone 2s ease-in-out infinite;
        }
        .halo-zone.top.cosmic { border-bottom: none; border-radius: 14px 14px 0 0; }
        .halo-zone.bottom.cosmic { border-top: none; border-radius: 0 0 14px 14px; }
        
        .halo-zone.supernovae {
            border: 3px solid transparent;
            background: linear-gradient(#12131a, #12131a) padding-box, 
                        conic-gradient(from var(--supernova-angle, 0deg), 
                            #ff4500, #ff8c00, #ffd700, #ffff00, #ff8c00, #ff4500) border-box;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.5), 
                        0 0 40px rgba(255, 69, 0, 0.3),
                        inset 0 0 30px rgba(255, 140, 0, 0.12);
            animation: supernovaRotate 3s linear infinite, supernovaPulseZone 1.5s ease-in-out infinite;
        }
        .halo-zone.top.supernovae { border-bottom: none; border-radius: 14px 14px 0 0; }
        .halo-zone.bottom.supernovae { border-top: none; border-radius: 0 0 14px 14px; }
        
        /* ============================================ */
        /* ANIMATIONS HALOS                            */
        /* ============================================ */
        
        /* Pour dominos uniques */
        @keyframes emeraldGlow {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(5, 150, 105, 0.5), 
                            0 0 40px rgba(52, 211, 153, 0.3), 
                            inset 0 0 25px rgba(52, 211, 153, 0.1); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(5, 150, 105, 0.7), 
                            0 0 55px rgba(52, 211, 153, 0.4), 
                            inset 0 0 35px rgba(52, 211, 153, 0.15); 
            }
        }
        
        @keyframes cosmicRotate { 
            to { --cosmic-angle: 360deg; } 
        }
        
        @keyframes cosmicPulse {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(131, 56, 236, 0.4), 
                            0 0 40px rgba(255, 0, 110, 0.2), 
                            0 0 50px rgba(6, 182, 212, 0.2), 
                            inset 0 0 30px rgba(131, 56, 236, 0.1); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(131, 56, 236, 0.6), 
                            0 0 55px rgba(255, 0, 110, 0.35), 
                            0 0 70px rgba(6, 182, 212, 0.3), 
                            inset 0 0 40px rgba(131, 56, 236, 0.15); 
            }
        }
        
        @keyframes supernovaRotate { 
            to { --supernova-angle: 360deg; } 
        }
        
        @keyframes supernovaPulse {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(255, 140, 0, 0.4), 
                            0 0 40px rgba(255, 69, 0, 0.2), 
                            0 0 50px rgba(255, 215, 0, 0.2), 
                            inset 0 0 30px rgba(255, 140, 0, 0.1); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(255, 140, 0, 0.6), 
                            0 0 55px rgba(255, 69, 0, 0.35), 
                            0 0 70px rgba(255, 215, 0, 0.3), 
                            inset 0 0 40px rgba(255, 140, 0, 0.15); 
            }
        }
        
        /* Pour zones de dominos doubles */
        @keyframes emeraldGlowZone {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(5, 150, 105, 0.6), 
                            0 0 40px rgba(52, 211, 153, 0.4),
                            inset 0 0 25px rgba(52, 211, 153, 0.12); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(5, 150, 105, 0.8), 
                            0 0 55px rgba(52, 211, 153, 0.5),
                            inset 0 0 35px rgba(52, 211, 153, 0.18); 
            }
        }
        
        @keyframes cosmicPulseZone {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(131, 56, 236, 0.5), 
                            0 0 40px rgba(255, 0, 110, 0.3),
                            inset 0 0 30px rgba(131, 56, 236, 0.12); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(131, 56, 236, 0.7), 
                            0 0 55px rgba(255, 0, 110, 0.45),
                            inset 0 0 40px rgba(131, 56, 236, 0.18); 
            }
        }
        
        @keyframes supernovaPulseZone {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(255, 140, 0, 0.5), 
                            0 0 40px rgba(255, 69, 0, 0.3),
                            inset 0 0 30px rgba(255, 140, 0, 0.12); 
            }
            50% { 
                box-shadow: 0 0 35px rgba(255, 140, 0, 0.7), 
                            0 0 55px rgba(255, 69, 0, 0.45),
                            inset 0 0 40px rgba(255, 140, 0, 0.18); 
            }
        }
        
        /* === SEPARATORS PAR ÉTAT === */
        .square svg .separator { stroke: rgba(180, 180, 190, 0.3); }
        
        /* Animations cosmic pour icônes */
        @keyframes cosmicIconShift { 
            0%, 100% { stroke: #c4b5fd; } 
            33% { stroke: #22d3ee; } 
            66% { stroke: #f472b6; } 
        }
        @keyframes cosmicPointPulse { 
            0%, 100% { fill: #c4b5fd; } 
            50% { fill: #f472b6; } 
        }
        
        @keyframes supernovaIconShift { 
            0%, 100% { stroke: #ffeb3b; } 
            25% { stroke: #ff8c00; } 
            50% { stroke: #ffd700; } 
            75% { stroke: #ff6347; } 
        }
        @keyframes supernovaPointPulse { 
            0%, 100% { fill: #ffeb3b; } 
            33% { fill: #ff8c00; } 
            66% { fill: #ffd700; } 
        }
    </style>
</head>
<body>
    <div class="grid-wrapper">
        <div class="grid-container" id="gridContainer"></div>
    </div>
    <div class="buttons-container">
        <button class="undo-button" id="undoBtn">Undo</button>
        <button class="undo-button" id="gravityBtn">Gravity</button>
    </div>

    <script>
        // ============================================
        // ADAM v25 - SPLIT MECHANIC
        // ============================================
        // Commandes:
        // - Drag horizontal → Glisse toute la LIGNE (wrap-around)
        // - Drag vertical → Glisse toute la COLONNE (wrap-around)
        // - Clic simple → Rotation 90° du domino
        // - Long press (500ms) sur double → SCISSION en 2 uniques
        // ============================================
        
        const COLS = 4;
        const ROWS = 5;
        const TOTAL = 20;
        const STATE_ORDER = ['white', 'silver', 'gold', 'emerald', 'cosmic', 'supernovae'];
        const LONG_PRESS_DURATION = 500; // ms pour déclencher la scission
        
        // Dimensions calculées dynamiquement
        let CELL_SIZE = 80;
        let CELL_GAP = 10;
        let CELL_TOTAL = 90;
        let GRID_WIDTH = COLS * CELL_TOTAL;
        let GRID_HEIGHT = ROWS * CELL_TOTAL;
        
        function updateDimensions() {
            const wrapper = document.querySelector('.grid-wrapper');
            const style = getComputedStyle(wrapper);
            const cellValue = style.getPropertyValue('--cell').trim();
            const gapValue = style.getPropertyValue('--gap').trim();
            
            // Parser les valeurs (peuvent être en px ou calculées)
            if (cellValue) {
                // Créer un élément temporaire pour mesurer la vraie taille
                const testEl = document.createElement('div');
                testEl.style.width = 'var(--cell)';
                testEl.style.position = 'absolute';
                testEl.style.visibility = 'hidden';
                wrapper.appendChild(testEl);
                CELL_SIZE = testEl.offsetWidth || 80;
                wrapper.removeChild(testEl);
            }
            
            CELL_GAP = parseFloat(gapValue) || 8;
            CELL_TOTAL = CELL_SIZE + CELL_GAP;
            GRID_WIDTH = COLS * CELL_TOTAL;
            GRID_HEIGHT = ROWS * CELL_TOTAL;
            
            console.log('Dimensions:', CELL_SIZE, CELL_GAP, CELL_TOTAL);
        }
        
        const container = document.getElementById('gridContainer');
        const undoBtn = document.getElementById('undoBtn');
        const gravityBtn = document.getElementById('gravityBtn');
        
        const GRAVITY_DELAY = 80; // Délai entre chaque étape de gravité (ms)
        
        let dominos = [];
        let dominoElements = [];
        let ghostElements = [];
        let history = [];
        const MAX_HISTORY = 20;
        let lastMovedIndices = [];
        let gravityMode = false; // Flag pour savoir si on est en cycle gravité
        
        // État du drag
        let isDragging = false;
        let dragAxis = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartTime = 0;
        let dragRow = -1;
        let dragCol = -1;
        let dragOffset = 0;
        let initialPositions = [];
        let clickedDominoIdx = null;
        let clickLocalX = 0; // Position X du clic relative au domino
        let isAnimating = false;
        
        // État du long press pour scission
        let longPressTimer = null;
        let longPressTriggered = false;
        let longPressTargetIdx = null;
        
        // Icônes - TOUS avec miroir f1 (pointe haut) / f2 (pointe bas)
        const ICONS = {
            chevron: { f1: 'M20 32L45 12L70 32', f2: 'M20 12L45 32L70 12', t: 'path' },
            triangle: { f1: 'M45 8L65 36L25 36Z', f2: 'M45 36L65 8L25 8Z', t: 'path' },
            threeLines: { f1: '25,10,25,34|45,10,45,34|65,10,65,34', f2: '25,34,25,10|45,34,45,10|65,34,65,10', t: 'lines' },
            square: { f1: '25,10,40,24,3', f2: '25,10,40,24,3', t: 'rect' }
        };
        
        function seededRandom(seed) {
            let state = seed;
            return function() {
                state = (state * 1103515245 + 12345) & 0x7fffffff;
                return state / 0x7fffffff;
            };
        }
        
        function initDominos() {
            dominos = [];
            
            // 4 symboles × 10 = 40 symboles pour 20 dominos
            const symbols = [
                'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines', 'threeLines',
                'square', 'square', 'square', 'square', 'square', 'square', 'square', 'square', 'square', 'square',
                'triangle', 'triangle', 'triangle', 'triangle', 'triangle', 'triangle', 'triangle', 'triangle', 'triangle', 'triangle',
                'chevron', 'chevron', 'chevron', 'chevron', 'chevron', 'chevron', 'chevron', 'chevron', 'chevron', 'chevron'
            ];
            
            const rng = seededRandom(20480);
            for (let i = symbols.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
            }
            
            for (let i = 0; i < TOTAL; i++) {
                const x = i % COLS;
                const y = Math.floor(i / COLS);
                dominos.push({
                    face1: symbols[i * 2],
                    face2: symbols[i * 2 + 1],
                    face1State: 'white',
                    face2State: 'white',
                    rotation: ((x + y) % 2 === 0) ? 0 : 90,
                    state: 'white',
                    type: 'double'
                });
            }
        }
        
        function renderIcon(icon, isFace2, faceState) {
            if (icon === 'empty') return '';
            const d = ICONS[icon];
            if (!d) return '';
            const data = isFace2 ? d.f2 : d.f1;
            const faceClass = isFace2 ? 'face2' : 'face1';
            const stateClass = `${faceClass}-${faceState}`;
            
            if (d.t === 'path') return `<path class="icon ${stateClass}" d="${data}"/>`;
            if (d.t === 'circle') {
                const [cx, cy, r] = data.split(',');
                return `<circle class="icon ${stateClass}" cx="${cx}" cy="${cy}" r="${r}"/>`;
            }
            if (d.t === 'line') {
                const [x1, y1, x2, y2] = data.split(',');
                return `<line class="icon ${stateClass}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            }
            if (d.t === 'rect') {
                const [x, y, w, h, rx] = data.split(',');
                return `<rect class="icon ${stateClass}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
            }
            if (d.t === 'lines') {
                return data.split('|').map(p => {
                    const [x1, y1, x2, y2] = p.split(',');
                    return `<line class="icon ${stateClass}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
                }).join('');
            }
            return data.split('|').map(p => {
                const v = p.split(',');
                return (d.t === 'circles' || d.t === 'points')
                    ? `<circle class="${d.t === 'points' ? 'point' : 'icon'} ${stateClass}" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/>`
                    : `<line class="icon ${stateClass}" x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}"/>`;
            }).join('');
        }
        
        function renderDominoSVG(d) {
            if (d.type === 'unique') {
                return `<svg viewBox="0 0 90 90">
                    <g class="face1-${d.face1State}" transform="translate(0,22.5)">${renderIcon(d.face1, false, d.face1State)}</g>
                </svg>`;
            }
            
            const medianeColors = {
                white: 'rgba(180, 180, 190, 0.35)',
                silver: 'rgba(6, 182, 212, 0.6)',
                gold: 'rgba(255, 215, 0, 0.7)',
                emerald: 'rgba(52, 211, 153, 0.9)',
                cosmic: 'rgba(196, 181, 253, 0.8)',
                supernovae: 'rgba(255, 235, 59, 0.8)'
            };
            
            const idx1 = STATE_ORDER.indexOf(d.face1State);
            const idx2 = STATE_ORDER.indexOf(d.face2State);
            const strongestState = idx1 >= idx2 ? d.face1State : d.face2State;
            const medianeColor = medianeColors[strongestState];
            
            return `<svg viewBox="0 0 90 90">
                <line class="separator" x1="0" y1="45" x2="90" y2="45" stroke="${medianeColor}" stroke-width="1"/>
                <g class="face1-${d.face1State}">${renderIcon(d.face1, false, d.face1State)}</g>
                <g class="face2-${d.face2State}" transform="translate(0,45)">${renderIcon(d.face2, true, d.face2State)}</g>
            </svg>`;
        }
        
        // ============================================
        // RENDU DES DOMINOS (positionnement absolu)
        // ============================================
        
        function createDominoElement(domino, index) {
            const el = document.createElement('div');
            el.dataset.index = index;
            
            if (!domino) {
                el.className = 'square empty';
            } else if (domino.type === 'whiteBorder') {
                el.className = 'square white-border';
            } else if (domino.type === 'unique') {
                // Domino unique : halo sur tout le square
                el.className = 'square unique ' + (domino.face1State || 'white');
                el.innerHTML = renderDominoSVG(domino);
            } else {
                // Domino double : halos séparés par zone
                el.className = 'square double';
                
                // Zone halo pour face1 (haut)
                const haloTop = document.createElement('div');
                haloTop.className = 'halo-zone top ' + (domino.face1State || 'white');
                el.appendChild(haloTop);
                
                // Zone halo pour face2 (bas)
                const haloBottom = document.createElement('div');
                haloBottom.className = 'halo-zone bottom ' + (domino.face2State || 'white');
                el.appendChild(haloBottom);
                
                // SVG par-dessus
                const svgWrapper = document.createElement('div');
                svgWrapper.style.cssText = 'position: relative; width: 100%; height: 100%; z-index: 1;';
                svgWrapper.innerHTML = renderDominoSVG(domino);
                el.appendChild(svgWrapper);
            }
            
            return el;
        }
        
        function updateAllPositions() {
            for (let i = 0; i < TOTAL; i++) {
                const col = i % COLS;
                const row = Math.floor(i / COLS);
                const el = dominoElements[i];
                if (el) {
                    el.style.transition = 'none';
                    el.style.left = (col * CELL_TOTAL) + 'px';
                    el.style.top = (row * CELL_TOTAL) + 'px';
                    // Appliquer la rotation du domino
                    if (dominos[i] && dominos[i].rotation !== undefined) {
                        el.style.transform = `rotate(${dominos[i].rotation}deg)`;
                    }
                }
            }
        }
        
        function render() {
            container.innerHTML = '';
            dominoElements = [];
            
            for (let i = 0; i < TOTAL; i++) {
                const el = createDominoElement(dominos[i], i);
                container.appendChild(el);
                dominoElements.push(el);
            }
            
            updateAllPositions();
        }
        
        // ============================================
        // SYSTÈME DE GHOSTS POUR WRAP-AROUND
        // ============================================
        
        function createGhosts(axis, rowOrCol) {
            clearGhosts();
            
            if (axis === 'horizontal') {
                for (let c = 0; c < COLS; c++) {
                    const idx = rowOrCol * COLS + c;
                    const domino = dominos[idx];
                    if (!domino) continue;
                    
                    // Ghost gauche
                    const ghostLeft = createDominoElement(domino, idx);
                    ghostLeft.classList.add('ghost');
                    ghostLeft.style.left = (c * CELL_TOTAL - GRID_WIDTH) + 'px';
                    ghostLeft.style.top = (rowOrCol * CELL_TOTAL) + 'px';
                    if (domino.rotation) ghostLeft.style.transform = `rotate(${domino.rotation}deg)`;
                    container.appendChild(ghostLeft);
                    ghostElements.push({ el: ghostLeft, baseX: c * CELL_TOTAL - GRID_WIDTH, idx });
                    
                    // Ghost droite
                    const ghostRight = createDominoElement(domino, idx);
                    ghostRight.classList.add('ghost');
                    ghostRight.style.left = (c * CELL_TOTAL + GRID_WIDTH) + 'px';
                    ghostRight.style.top = (rowOrCol * CELL_TOTAL) + 'px';
                    if (domino.rotation) ghostRight.style.transform = `rotate(${domino.rotation}deg)`;
                    container.appendChild(ghostRight);
                    ghostElements.push({ el: ghostRight, baseX: c * CELL_TOTAL + GRID_WIDTH, idx });
                }
            } else {
                for (let r = 0; r < ROWS; r++) {
                    const idx = r * COLS + rowOrCol;
                    const domino = dominos[idx];
                    if (!domino) continue;
                    
                    // Ghost haut
                    const ghostTop = createDominoElement(domino, idx);
                    ghostTop.classList.add('ghost');
                    ghostTop.style.left = (rowOrCol * CELL_TOTAL) + 'px';
                    ghostTop.style.top = (r * CELL_TOTAL - GRID_HEIGHT) + 'px';
                    if (domino.rotation) ghostTop.style.transform = `rotate(${domino.rotation}deg)`;
                    container.appendChild(ghostTop);
                    ghostElements.push({ el: ghostTop, baseY: r * CELL_TOTAL - GRID_HEIGHT, idx });
                    
                    // Ghost bas
                    const ghostBottom = createDominoElement(domino, idx);
                    ghostBottom.classList.add('ghost');
                    ghostBottom.style.left = (rowOrCol * CELL_TOTAL) + 'px';
                    ghostBottom.style.top = (r * CELL_TOTAL + GRID_HEIGHT) + 'px';
                    if (domino.rotation) ghostBottom.style.transform = `rotate(${domino.rotation}deg)`;
                    container.appendChild(ghostBottom);
                    ghostElements.push({ el: ghostBottom, baseY: r * CELL_TOTAL + GRID_HEIGHT, idx });
                }
            }
        }
        
        function clearGhosts() {
            ghostElements.forEach(g => g.el.remove());
            ghostElements = [];
        }
        
        // ============================================
        // GESTION DU DRAG
        // ============================================
        
        function startDrag(e) {
            if (isAnimating) return;
            
            const el = e.target.closest('.square');
            if (!el || el.classList.contains('ghost') || el.classList.contains('empty')) return;
            
            e.preventDefault();
            
            const idx = parseInt(el.dataset.index);
            const col = idx % COLS;
            const row = Math.floor(idx / COLS);
            
            isDragging = true;
            dragAxis = null;
            dragRow = row;
            dragCol = col;
            dragOffset = 0;
            clickedDominoIdx = idx;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
            dragStartTime = Date.now();
            
            // Calculer la position du clic relative au domino
            const rect = el.getBoundingClientRect();
            clickLocalX = clientX - rect.left;
            
            initialPositions = [];
            
            // Long press : démarrer le timer si c'est un domino double
            longPressTriggered = false;
            longPressTargetIdx = idx;
            clearTimeout(longPressTimer);
            
            const domino = dominos[idx];
            if (domino && domino.type === 'double') {
                // Indicateur visuel du long press
                el.classList.add('long-press-indicator');
                
                longPressTimer = setTimeout(() => {
                    if (!dragAxis && clickedDominoIdx === idx) {
                        // Long press confirmé !
                        longPressTriggered = true;
                        el.classList.remove('long-press-indicator');
                        performSplit(idx);
                    }
                }, LONG_PRESS_DURATION);
            }
        }
        
        function moveDrag(e) {
            if (!isDragging || isAnimating) return;
            e.preventDefault();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const deltaX = clientX - dragStartX;
            const deltaY = clientY - dragStartY;
            
            // Déterminer l'axe au premier mouvement significatif
            if (dragAxis === null) {
                const threshold = 8;
                if (Math.abs(deltaX) > threshold || Math.abs(deltaY) > threshold) {
                    // Annuler le long press si on commence à bouger
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                    if (longPressTargetIdx !== null && dominoElements[longPressTargetIdx]) {
                        dominoElements[longPressTargetIdx].classList.remove('long-press-indicator');
                    }
                    
                    dragAxis = Math.abs(deltaX) > Math.abs(deltaY) ? 'horizontal' : 'vertical';
                    
                    // Sauvegarder l'état avant le mouvement
                    saveState();
                    
                    if (dragAxis === 'horizontal') {
                        for (let c = 0; c < COLS; c++) {
                            const idx = dragRow * COLS + c;
                            initialPositions.push({
                                idx,
                                baseX: c * CELL_TOTAL
                            });
                        }
                        createGhosts('horizontal', dragRow);
                    } else {
                        for (let r = 0; r < ROWS; r++) {
                            const idx = r * COLS + dragCol;
                            initialPositions.push({
                                idx,
                                baseY: r * CELL_TOTAL
                            });
                        }
                        createGhosts('vertical', dragCol);
                    }
                }
            }
            
            if (dragAxis === null) return;
            
            // Déplacer les dominos et les ghosts
            if (dragAxis === 'horizontal') {
                dragOffset = deltaX;
                
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (el) {
                        const newX = item.baseX + dragOffset;
                        el.style.transition = 'none';
                        el.style.left = newX + 'px';
                    }
                }
                
                for (const ghost of ghostElements) {
                    const newX = ghost.baseX + dragOffset;
                    ghost.el.style.transition = 'none';
                    ghost.el.style.left = newX + 'px';
                }
            } else {
                dragOffset = deltaY;
                
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (el) {
                        const newY = item.baseY + dragOffset;
                        el.style.transition = 'none';
                        el.style.top = newY + 'px';
                    }
                }
                
                for (const ghost of ghostElements) {
                    const newY = ghost.baseY + dragOffset;
                    ghost.el.style.transition = 'none';
                    ghost.el.style.top = newY + 'px';
                }
            }
        }
        
        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            // Nettoyer le long press
            clearTimeout(longPressTimer);
            longPressTimer = null;
            if (longPressTargetIdx !== null && dominoElements[longPressTargetIdx]) {
                dominoElements[longPressTargetIdx].classList.remove('long-press-indicator');
            }
            
            // Si le long press a été déclenché, ne rien faire d'autre
            if (longPressTriggered) {
                longPressTriggered = false;
                longPressTargetIdx = null;
                clickedDominoIdx = null;
                dragAxis = null;
                initialPositions = [];
                return;
            }
            
            longPressTargetIdx = null;
            
            const elapsed = Date.now() - dragStartTime;
            const distance = Math.abs(dragOffset);
            
            // Si c'est un clic → rotation selon la position
            if (distance < 8 && elapsed < 250 && clickedDominoIdx !== null) {
                // Déterminer le sens de rotation selon la moitié cliquée
                const clickedRight = clickLocalX > (CELL_SIZE / 2);
                rotateDomino(clickedDominoIdx, clickedRight);
                clearGhosts();
                clickedDominoIdx = null;
                dragAxis = null;
                initialPositions = [];
                return;
            }
            
            clickedDominoIdx = null;
            
            if (dragAxis === null) {
                clearGhosts();
                return;
            }
            
            // Calculer le nombre de crans
            let steps = Math.round(dragOffset / CELL_TOTAL);
            
            if (dragAxis === 'horizontal') {
                // Phase 1: Téléporter près de la cible (sans animation) pour éviter les sauts
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (!el) continue;
                    
                    let currentX = item.baseX + dragOffset;
                    const originalCol = Math.round(item.baseX / CELL_TOTAL);
                    const newCol = ((originalCol + steps) % COLS + COLS) % COLS;
                    const targetX = newCol * CELL_TOTAL;
                    
                    // Normaliser currentX pour qu'il soit proche de targetX
                    while (currentX - targetX > GRID_WIDTH / 2) currentX -= GRID_WIDTH;
                    while (targetX - currentX > GRID_WIDTH / 2) currentX += GRID_WIDTH;
                    
                    el.style.transition = 'none';
                    el.style.left = currentX + 'px';
                }
                
                // Forcer reflow
                container.offsetHeight;
                
                // Phase 2: Animer vers la position finale
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (!el) continue;
                    
                    const originalCol = Math.round(item.baseX / CELL_TOTAL);
                    const newCol = ((originalCol + steps) % COLS + COLS) % COLS;
                    const targetX = newCol * CELL_TOTAL;
                    
                    el.style.transition = 'left 0.15s ease-out';
                    el.style.left = targetX + 'px';
                }
                
                // Mettre à jour la grille logique
                const row = dragRow;
                const newRowDominos = [];
                for (let c = 0; c < COLS; c++) {
                    const sourceCol = ((c - steps) % COLS + COLS) % COLS;
                    newRowDominos[c] = dominos[row * COLS + sourceCol];
                }
                for (let c = 0; c < COLS; c++) {
                    dominos[row * COLS + c] = newRowDominos[c];
                }
                
                // Tracker les indices qui ont bougé
                lastMovedIndices = [];
                for (let c = 0; c < COLS; c++) {
                    lastMovedIndices.push(row * COLS + c);
                }
                
            } else {
                // Phase 1: Téléporter près de la cible (sans animation) pour éviter les sauts
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (!el) continue;
                    
                    let currentY = item.baseY + dragOffset;
                    const originalRow = Math.round(item.baseY / CELL_TOTAL);
                    const newRow = ((originalRow + steps) % ROWS + ROWS) % ROWS;
                    const targetY = newRow * CELL_TOTAL;
                    
                    // Normaliser currentY pour qu'il soit proche de targetY
                    while (currentY - targetY > GRID_HEIGHT / 2) currentY -= GRID_HEIGHT;
                    while (targetY - currentY > GRID_HEIGHT / 2) currentY += GRID_HEIGHT;
                    
                    el.style.transition = 'none';
                    el.style.top = currentY + 'px';
                }
                
                // Forcer reflow
                container.offsetHeight;
                
                // Phase 2: Animer vers la position finale
                for (const item of initialPositions) {
                    const el = dominoElements[item.idx];
                    if (!el) continue;
                    
                    const originalRow = Math.round(item.baseY / CELL_TOTAL);
                    const newRow = ((originalRow + steps) % ROWS + ROWS) % ROWS;
                    const targetY = newRow * CELL_TOTAL;
                    
                    el.style.transition = 'top 0.15s ease-out';
                    el.style.top = targetY + 'px';
                }
                
                // Mettre à jour la grille logique
                const col = dragCol;
                const newColDominos = [];
                for (let r = 0; r < ROWS; r++) {
                    const sourceRow = ((r - steps) % ROWS + ROWS) % ROWS;
                    newColDominos[r] = dominos[sourceRow * COLS + col];
                }
                for (let r = 0; r < ROWS; r++) {
                    dominos[r * COLS + col] = newColDominos[r];
                }
                
                // Tracker les indices qui ont bougé
                lastMovedIndices = [];
                for (let r = 0; r < ROWS; r++) {
                    lastMovedIndices.push(r * COLS + col);
                }
            }
            
            clearGhosts();
            
            // Après l'animation, re-render proprement et vérifier les fusions
            setTimeout(() => {
                render();
                if (gravityMode) {
                    applyGravity();
                } else {
                    checkFusions();
                }
            }, 160);
            
            dragAxis = null;
            initialPositions = [];
        }
        
        // ============================================
        // ROTATION INDIVIDUELLE (clic simple)
        // clockwise = true → horaire (+90°), false → antihoraire (-90°)
        // ============================================
        
        function rotateDomino(idx, clockwise = true) {
            const domino = dominos[idx];
            if (!domino || domino.type === 'whiteBorder') return;
            
            saveState();
            
            // Rotation horaire (+90) ou antihoraire (-90)
            domino.rotation = (domino.rotation || 0) + (clockwise ? 90 : -90);
            lastMovedIndices = [idx];
            
            const el = dominoElements[idx];
            if (el) {
                el.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                el.style.transform = `rotate(${domino.rotation}deg)`;
                
                setTimeout(() => {
                    if (gravityMode) {
                        applyGravity();
                    } else {
                        checkFusions();
                    }
                }, 300);
            }
        }
        
        // ============================================
        // SYSTÈME DE FUSION
        // ============================================
        
        function getPos(i) { return { x: i % COLS, y: Math.floor(i / COLS) }; }
        function getIndex(x, y) { return (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? -1 : y * COLS + x; }
        
        function getExposedFace(domino, dir) {
            if (!domino || domino.type !== 'double') return null;
            const r = ((domino.rotation % 360) + 360) % 360;
            const map = {
                0:   { top: 'face1', bottom: 'face2', left: null, right: null },
                90:  { top: null, bottom: null, left: 'face2', right: 'face1' },
                180: { top: 'face2', bottom: 'face1', left: null, right: null },
                270: { top: null, bottom: null, left: 'face1', right: 'face2' }
            };
            const face = map[r]?.[dir];
            return face ? domino[face] : null;
        }
        
        function getExposedFaceKey(domino, dir) {
            if (!domino || domino.type !== 'double') return null;
            const r = ((domino.rotation % 360) + 360) % 360;
            const map = {
                0:   { top: 'face1', bottom: 'face2', left: null, right: null },
                90:  { top: null, bottom: null, left: 'face2', right: 'face1' },
                180: { top: 'face2', bottom: 'face1', left: null, right: null },
                270: { top: null, bottom: null, left: 'face1', right: 'face2' }
            };
            return map[r]?.[dir] || null;
        }
        
        function checkFusions() {
            if (isAnimating) return;
            
            // Vérifier les fusions de dominos Unique adjacents
            for (let i = 0; i < TOTAL; i++) {
                if (!dominos[i] || dominos[i].type !== 'unique') continue;
                const { x, y } = getPos(i);
                
                // Vérifier les 4 directions
                const directions = [
                    { dx: 1, dy: 0, dir: 'horizontal' },
                    { dx: -1, dy: 0, dir: 'horizontal' },
                    { dx: 0, dy: 1, dir: 'vertical' },
                    { dx: 0, dy: -1, dir: 'vertical' }
                ];
                
                for (const { dx, dy, dir } of directions) {
                    const ni = getIndex(x + dx, y + dy);
                    if (ni !== -1 && dominos[ni] && dominos[ni].type === 'unique') {
                        const isMoved = lastMovedIndices.includes(i);
                        const isNMoved = lastMovedIndices.includes(ni);
                        if (isMoved && !isNMoved) {
                            performUniqueFusion(ni, i, dir);
                        } else {
                            performUniqueFusion(i, ni, dir);
                        }
                        return;
                    }
                }
            }
            
            // Vérifier les fusions de dominos Double avec faces identiques
            // D'ABORD vérifier les DOUBLES FUSIONS (explosion)
            for (let i = 0; i < TOTAL; i++) {
                if (!dominos[i] || dominos[i].type !== 'double') continue;
                if (!lastMovedIndices.includes(i)) continue; // Seul le domino qui a bougé peut exploser
                
                const domino = dominos[i];
                const { x, y } = getPos(i);
                const r = ((domino.rotation % 360) + 360) % 360;
                
                // Vérifier si c'est une orientation horizontale (médiane verticale, faces gauche/droite exposées)
                if (r === 90 || r === 270) {
                    const iL = getIndex(x - 1, y);
                    const iR = getIndex(x + 1, y);
                    
                    if (iL !== -1 && iR !== -1 && 
                        dominos[iL] && dominos[iL].type === 'double' &&
                        dominos[iR] && dominos[iR].type === 'double') {
                        
                        const faceLeft = getExposedFace(domino, 'left');
                        const faceRight = getExposedFace(domino, 'right');
                        const neighborLeftFace = getExposedFace(dominos[iL], 'right');
                        const neighborRightFace = getExposedFace(dominos[iR], 'left');
                        
                        if (faceLeft && neighborLeftFace && faceLeft === neighborLeftFace &&
                            faceRight && neighborRightFace && faceRight === neighborRightFace) {
                            // DOUBLE FUSION HORIZONTALE !
                            performDoubleFusion(i, iL, iR, 'horizontal');
                            return;
                        }
                    }
                }
                
                // Vérifier si c'est une orientation verticale (médiane horizontale, faces haut/bas exposées)
                if (r === 0 || r === 180) {
                    const iT = getIndex(x, y - 1);
                    const iB = getIndex(x, y + 1);
                    
                    if (iT !== -1 && iB !== -1 && 
                        dominos[iT] && dominos[iT].type === 'double' &&
                        dominos[iB] && dominos[iB].type === 'double') {
                        
                        const faceTop = getExposedFace(domino, 'top');
                        const faceBottom = getExposedFace(domino, 'bottom');
                        const neighborTopFace = getExposedFace(dominos[iT], 'bottom');
                        const neighborBottomFace = getExposedFace(dominos[iB], 'top');
                        
                        if (faceTop && neighborTopFace && faceTop === neighborTopFace &&
                            faceBottom && neighborBottomFace && faceBottom === neighborBottomFace) {
                            // DOUBLE FUSION VERTICALE !
                            performDoubleFusion(i, iT, iB, 'vertical');
                            return;
                        }
                    }
                }
            }
            
            // Ensuite vérifier les fusions simples
            for (let i = 0; i < TOTAL; i++) {
                if (!dominos[i] || dominos[i].type !== 'double') continue;
                const { x, y } = getPos(i);
                
                // Vérifier à droite
                const iR = getIndex(x + 1, y);
                if (iR !== -1 && dominos[iR] && dominos[iR].type === 'double') {
                    const faceLeft = getExposedFace(dominos[i], 'right');
                    const faceRight = getExposedFace(dominos[iR], 'left');
                    if (faceLeft && faceRight && faceLeft === faceRight) {
                        const isMoved = lastMovedIndices.includes(i);
                        const isRMoved = lastMovedIndices.includes(iR);
                        if (isMoved && !isRMoved) {
                            performCompressionFusion(iR, i, 'horizontal');
                        } else {
                            performCompressionFusion(i, iR, 'horizontal');
                        }
                        return;
                    }
                }
                
                // Vérifier en bas
                const iB = getIndex(x, y + 1);
                if (iB !== -1 && dominos[iB] && dominos[iB].type === 'double') {
                    const faceTop = getExposedFace(dominos[i], 'bottom');
                    const faceBottom = getExposedFace(dominos[iB], 'top');
                    if (faceTop && faceBottom && faceTop === faceBottom) {
                        const isMoved = lastMovedIndices.includes(i);
                        const isBMoved = lastMovedIndices.includes(iB);
                        if (isMoved && !isBMoved) {
                            performCompressionFusion(iB, i, 'vertical');
                        } else {
                            performCompressionFusion(i, iB, 'vertical');
                        }
                        return;
                    }
                }
            }
        }
        
        function performUniqueFusion(receiverIdx, projectileIdx, direction) {
            if (isAnimating) return;
            isAnimating = true;
            
            const receiver = dominos[receiverIdx];
            const projectile = dominos[projectileIdx];
            
            const receiverEl = dominoElements[receiverIdx];
            const projectileEl = dominoElements[projectileIdx];
            
            if (receiverEl) receiverEl.classList.add('fusion-animation');
            if (projectileEl) projectileEl.classList.add('fusion-animation');
            
            setTimeout(() => {
                const face1State = receiver.face1State;
                const face2State = projectile.face1State;
                
                const newDomino = {
                    face1: receiver.face1,
                    face2: projectile.face1,
                    face1State: face1State,
                    face2State: face2State,
                    rotation: direction === 'horizontal' ? 90 : 0,
                    state: STATE_ORDER[Math.max(STATE_ORDER.indexOf(face1State), STATE_ORDER.indexOf(face2State))],
                    type: 'double'
                };
                
                dominos[receiverIdx] = newDomino;
                dominos[projectileIdx] = { type: 'whiteBorder', rotation: 0 };
                
                render();
                isAnimating = false;
                lastMovedIndices = [];
                
                // Si en mode gravité, relancer la gravité
                if (gravityMode) {
                    setTimeout(() => applyGravity(), 50);
                } else {
                    setTimeout(checkFusions, 50);
                }
            }, 400);
        }
        
        function performCompressionFusion(receiverIdx, projectileIdx, direction) {
            if (isAnimating) return;
            isAnimating = true;
            
            const receiver = dominos[receiverIdx];
            const projectile = dominos[projectileIdx];
            
            const receiverEl = dominoElements[receiverIdx];
            const projectileEl = dominoElements[projectileIdx];
            
            if (!receiverEl || !projectileEl || !receiver || !projectile) {
                isAnimating = false;
                return;
            }
            
            const isHorizontal = (direction === 'horizontal');
            const receiverPos = getPos(receiverIdx);
            const projectilePos = getPos(projectileIdx);
            
            let receiverTouchingKey, projectileTouchingKey, projectileFarKey;
            let tiltAxis, tiltAngle; // Pour l'animation de bascule
            
            if (isHorizontal) {
                if (projectilePos.x > receiverPos.x) {
                    // Projectile à droite → bascule vers la gauche
                    receiverTouchingKey = getExposedFaceKey(receiver, 'right');
                    projectileTouchingKey = getExposedFaceKey(projectile, 'left');
                    projectileFarKey = getExposedFaceKey(projectile, 'right');
                    tiltAxis = 'Y';
                    tiltAngle = -25;
                } else {
                    // Projectile à gauche → bascule vers la droite
                    receiverTouchingKey = getExposedFaceKey(receiver, 'left');
                    projectileTouchingKey = getExposedFaceKey(projectile, 'right');
                    projectileFarKey = getExposedFaceKey(projectile, 'left');
                    tiltAxis = 'Y';
                    tiltAngle = 25;
                }
            } else {
                if (projectilePos.y > receiverPos.y) {
                    // Projectile en bas → bascule vers le haut
                    receiverTouchingKey = getExposedFaceKey(receiver, 'bottom');
                    projectileTouchingKey = getExposedFaceKey(projectile, 'top');
                    projectileFarKey = getExposedFaceKey(projectile, 'bottom');
                    tiltAxis = 'X';
                    tiltAngle = 25;
                } else {
                    // Projectile en haut → bascule vers le bas
                    receiverTouchingKey = getExposedFaceKey(receiver, 'top');
                    projectileTouchingKey = getExposedFaceKey(projectile, 'bottom');
                    projectileFarKey = getExposedFaceKey(projectile, 'top');
                    tiltAxis = 'X';
                    tiltAngle = -25;
                }
            }
            
            // Animation JS de bascule qui CONSERVE la rotation de base du domino
            const baseRotation = projectile.rotation || 0;
            projectileEl.style.transition = 'transform 0.2s ease-out, opacity 0.4s ease-out';
            
            // Phase 1 : bascule vers le receiver (en gardant la rotation de base)
            projectileEl.style.transform = `rotate(${baseRotation}deg) perspective(200px) rotate${tiltAxis}(${tiltAngle}deg) scale(0.95)`;
            projectileEl.style.opacity = '0.8';
            
            // Phase 2 : retour et fondu
            setTimeout(() => {
                projectileEl.style.transform = `rotate(${baseRotation}deg) scale(0.9)`;
                projectileEl.style.opacity = '0.6';
            }, 200);
            
            setTimeout(() => {
                const newDomino = {
                    face1: receiver.face1,
                    face2: receiver.face2,
                    face1State: receiver.face1State,
                    face2State: receiver.face2State,
                    rotation: receiver.rotation,
                    state: receiver.state,
                    type: 'double'
                };
                
                // Logique additive
                if (receiverTouchingKey && projectileTouchingKey) {
                    const receiverStateIdx = STATE_ORDER.indexOf(receiver[receiverTouchingKey + 'State']);
                    const projectileStateIdx = STATE_ORDER.indexOf(projectile[projectileTouchingKey + 'State']);
                    const sumIdx = Math.min(receiverStateIdx + projectileStateIdx + 1, STATE_ORDER.length - 1);
                    newDomino[receiverTouchingKey + 'State'] = STATE_ORDER[sumIdx];
                }
                
                const idx1 = STATE_ORDER.indexOf(newDomino.face1State);
                const idx2 = STATE_ORDER.indexOf(newDomino.face2State);
                newDomino.state = STATE_ORDER[Math.max(idx1, idx2)];
                
                // Recycler en domino unique
                // IMPORTANT: face2 a un dessin miroir (f2 vs f1), donc si on extrait face2
                // il faut ajouter 180° pour compenser et garder l'orientation visuelle
                const isFace2 = (projectileFarKey === 'face2');
                const recycledRotation = isFace2 
                    ? (projectile.rotation + 180) % 360 
                    : projectile.rotation;
                
                const recycledDomino = {
                    face1: projectile[projectileFarKey],
                    face1State: projectile[projectileFarKey + 'State'],
                    rotation: recycledRotation,
                    state: projectile[projectileFarKey + 'State'],
                    type: 'unique'
                };
                
                dominos[receiverIdx] = newDomino;
                dominos[projectileIdx] = recycledDomino;
                
                render();
                lastMovedIndices = [];
                
                setTimeout(() => {
                    isAnimating = false;
                    // Si en mode gravité, relancer la gravité
                    if (gravityMode) {
                        applyGravity();
                    } else {
                        checkFusions();
                    }
                }, 100);
            }, 400);
        }
        
        // ============================================
        // DOUBLE FUSION (Explosion)
        // ============================================
        
        function performDoubleFusion(centerIdx, neighbor1Idx, neighbor2Idx, direction) {
            if (isAnimating) return;
            isAnimating = true;
            
            const center = dominos[centerIdx];
            const neighbor1 = dominos[neighbor1Idx];
            const neighbor2 = dominos[neighbor2Idx];
            
            const centerEl = dominoElements[centerIdx];
            const neighbor1El = dominoElements[neighbor1Idx];
            const neighbor2El = dominoElements[neighbor2Idx];
            
            if (!centerEl || !neighbor1El || !neighbor2El || !center || !neighbor1 || !neighbor2) {
                isAnimating = false;
                return;
            }
            
            const isHorizontal = (direction === 'horizontal');
            const baseRotation = center.rotation || 0;
            
            // Déterminer quelles faces touchent quels voisins
            let face1Dir, face2Dir, neighbor1TouchDir, neighbor2TouchDir;
            
            if (isHorizontal) {
                // neighbor1 = gauche, neighbor2 = droite
                face1Dir = getExposedFaceKey(center, 'left');
                face2Dir = getExposedFaceKey(center, 'right');
                neighbor1TouchDir = 'right';
                neighbor2TouchDir = 'left';
            } else {
                // neighbor1 = haut, neighbor2 = bas
                face1Dir = getExposedFaceKey(center, 'top');
                face2Dir = getExposedFaceKey(center, 'bottom');
                neighbor1TouchDir = 'bottom';
                neighbor2TouchDir = 'top';
            }
            
            // Animation d'explosion : les deux moitiés partent vers leurs voisins
            centerEl.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
            
            if (isHorizontal) {
                // Explosion horizontale : scale X vers 0, étirement vers les côtés
                centerEl.style.transform = `rotate(${baseRotation}deg) scaleX(0.3) scaleY(1.2)`;
            } else {
                // Explosion verticale : scale Y vers 0, étirement vers haut/bas
                centerEl.style.transform = `rotate(${baseRotation}deg) scaleY(0.3) scaleX(1.2)`;
            }
            centerEl.style.opacity = '0.3';
            
            // Animation pulse sur les voisins qui reçoivent
            neighbor1El.classList.add('fusion-animation');
            neighbor2El.classList.add('fusion-animation');
            
            setTimeout(() => {
                // Mettre à jour neighbor1 (gauche ou haut)
                const neighbor1TouchKey = getExposedFaceKey(neighbor1, neighbor1TouchDir);
                if (neighbor1TouchKey) {
                    const currentStateIdx = STATE_ORDER.indexOf(neighbor1[neighbor1TouchKey + 'State']);
                    const addStateIdx = STATE_ORDER.indexOf(center[face1Dir + 'State']);
                    const newStateIdx = Math.min(currentStateIdx + addStateIdx + 1, STATE_ORDER.length - 1);
                    neighbor1[neighbor1TouchKey + 'State'] = STATE_ORDER[newStateIdx];
                    
                    const idx1 = STATE_ORDER.indexOf(neighbor1.face1State);
                    const idx2 = STATE_ORDER.indexOf(neighbor1.face2State);
                    neighbor1.state = STATE_ORDER[Math.max(idx1, idx2)];
                }
                
                // Mettre à jour neighbor2 (droite ou bas)
                const neighbor2TouchKey = getExposedFaceKey(neighbor2, neighbor2TouchDir);
                if (neighbor2TouchKey) {
                    const currentStateIdx = STATE_ORDER.indexOf(neighbor2[neighbor2TouchKey + 'State']);
                    const addStateIdx = STATE_ORDER.indexOf(center[face2Dir + 'State']);
                    const newStateIdx = Math.min(currentStateIdx + addStateIdx + 1, STATE_ORDER.length - 1);
                    neighbor2[neighbor2TouchKey + 'State'] = STATE_ORDER[newStateIdx];
                    
                    const idx1 = STATE_ORDER.indexOf(neighbor2.face1State);
                    const idx2 = STATE_ORDER.indexOf(neighbor2.face2State);
                    neighbor2.state = STATE_ORDER[Math.max(idx1, idx2)];
                }
                
                // Le centre disparaît
                dominos[centerIdx] = { type: 'whiteBorder', rotation: 0 };
                
                render();
                lastMovedIndices = [];
                
                setTimeout(() => {
                    isAnimating = false;
                    if (gravityMode) {
                        applyGravity();
                    } else {
                        checkFusions();
                    }
                }, 100);
            }, 350);
        }
        
        // ============================================
        // SCISSION (Long Press sur Double)
        // ============================================
        
        function getEmptyPositions() {
            // Retourne les indices des positions vides (whiteBorder)
            const emptyIndices = [];
            for (let i = 0; i < TOTAL; i++) {
                if (dominos[i] && dominos[i].type === 'whiteBorder') {
                    emptyIndices.push(i);
                }
            }
            return emptyIndices;
        }
        
        function performSplit(idx) {
            if (isAnimating) return;
            
            const domino = dominos[idx];
            if (!domino || domino.type !== 'double') return;
            
            // Trouver les positions vides
            const emptyPositions = getEmptyPositions();
            
            // Exiger minimum 2 cases vides
            if (emptyPositions.length < 2) {
                // Pas assez de positions vides → échec avec feedback visuel
                const el = dominoElements[idx];
                if (el) {
                    el.classList.add('split-fail');
                    setTimeout(() => el.classList.remove('split-fail'), 400);
                }
                return;
            }
            
            isAnimating = true;
            saveState();
            
            // Calculer la distance de Manhattan pour chaque position vide
            const { x: srcX, y: srcY } = getPos(idx);
            
            let farthestIdx = emptyPositions[0];
            let maxDistance = 0;
            
            for (const emptyIdx of emptyPositions) {
                const { x, y } = getPos(emptyIdx);
                const distance = Math.abs(x - srcX) + Math.abs(y - srcY);
                if (distance > maxDistance) {
                    maxDistance = distance;
                    farthestIdx = emptyIdx;
                }
            }
            
            const targetIdx = farthestIdx;
            
            // Décider aléatoirement quelle face reste et quelle face part
            const face1Stays = Math.random() < 0.5;
            
            // Créer les deux dominos uniques
            const stayingUnique = {
                face1: face1Stays ? domino.face1 : domino.face2,
                face1State: face1Stays ? domino.face1State : domino.face2State,
                rotation: 0,
                state: face1Stays ? domino.face1State : domino.face2State,
                type: 'unique'
            };
            
            const flyingUnique = {
                face1: face1Stays ? domino.face2 : domino.face1,
                face1State: face1Stays ? domino.face2State : domino.face1State,
                rotation: 0,
                state: face1Stays ? domino.face2State : domino.face1State,
                type: 'unique'
            };
            
            // Animation de scission sur l'original
            const el = dominoElements[idx];
            if (el) {
                el.classList.add('split-animation');
            }
            
            setTimeout(() => {
                // Mettre à jour les dominos
                dominos[idx] = stayingUnique;
                dominos[targetIdx] = flyingUnique;
                
                // Re-render
                render();
                
                // Animation d'arrivée sur le nouveau
                const newEl = dominoElements[targetIdx];
                if (newEl) {
                    newEl.classList.add('split-fly-animation');
                    setTimeout(() => newEl.classList.remove('split-fly-animation'), 400);
                }
                
                lastMovedIndices = [idx, targetIdx];
                
                setTimeout(() => {
                    isAnimating = false;
                    // Vérifier les fusions après scission
                    if (gravityMode) {
                        applyGravity();
                    } else {
                        checkFusions();
                    }
                }, 100);
            }, 300);
        }
        
        // ============================================
        // GRAVITÉ (style Tetris)
        // ============================================
        
        function applyGravity(onComplete) {
            if (isAnimating) return;
            isAnimating = true;
            
            let moved = true;
            
            const animateGravity = () => {
                moved = false;
                
                // Parcourir de bas en haut (sauf dernière ligne)
                for (let y = ROWS - 2; y >= 0; y--) {
                    for (let x = 0; x < COLS; x++) {
                        const i = getIndex(x, y);
                        const iBelow = getIndex(x, y + 1);
                        
                        // Si case actuelle a un domino et case en-dessous est vide
                        if (dominos[i] && dominos[i].type !== 'whiteBorder' && 
                            (!dominos[iBelow] || dominos[iBelow].type === 'whiteBorder')) {
                            
                            // Déplacer vers le bas
                            dominos[iBelow] = dominos[i];
                            dominos[i] = null;
                            moved = true;
                        }
                    }
                }
                
                render();
                
                if (moved) {
                    setTimeout(animateGravity, GRAVITY_DELAY);
                } else {
                    // Gravité terminée
                    setTimeout(() => {
                        isAnimating = false;
                        if (onComplete) {
                            onComplete();
                        } else {
                            // Vérifier les fusions après gravité
                            checkFusionsAfterGravity();
                        }
                    }, 150);
                }
            };
            
            animateGravity();
        }
        
        function checkFusionsAfterGravity() {
            // Reset lastMovedIndices pour que les fusions marchent
            lastMovedIndices = [];
            
            // Marquer tous les dominos comme "moved" pour permettre les fusions
            for (let i = 0; i < TOTAL; i++) {
                if (dominos[i] && dominos[i].type !== 'whiteBorder') {
                    lastMovedIndices.push(i);
                }
            }
            
            // Vérifier s'il y a des fusions possibles
            const hasFusion = detectFusion();
            
            if (hasFusion) {
                // Il y a une fusion, checkFusions va la traiter
                // et après la fusion, on relancera la gravité
                checkFusions();
            }
            // Si pas de fusion, le cycle s'arrête naturellement
            // mais gravityMode reste actif pour le prochain mouvement
        }
        
        function detectFusion() {
            // Détecter si une fusion est possible (sans l'exécuter)
            
            // Vérifier les fusions de dominos Unique adjacents
            for (let i = 0; i < TOTAL; i++) {
                if (!dominos[i] || dominos[i].type !== 'unique') continue;
                const { x, y } = getPos(i);
                
                const directions = [
                    { dx: 1, dy: 0 },
                    { dx: 0, dy: 1 }
                ];
                
                for (const { dx, dy } of directions) {
                    const ni = getIndex(x + dx, y + dy);
                    if (ni !== -1 && dominos[ni] && dominos[ni].type === 'unique') {
