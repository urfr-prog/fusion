<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cylindre - Proto v8 - Selection Fix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            height: 100dvh;
            max-height: 844px;
            background: linear-gradient(180deg, #0d0d15 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
            position: relative;
            overflow: hidden;
        }

        .scene {
            width: 350px;
            height: 540px;
            perspective: 900px;
            perspective-origin: 50% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cylinder {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .crown {
            position: absolute;
            width: 100%;
            left: 0;
            height: 90px;
            transform-style: preserve-3d;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .crown.dragging {
            transition: none;
        }

        .crown-cell {
            position: absolute;
            width: 68px;
            height: 85px;
            left: 50%;
            margin-left: -34px;
            border-radius: 16px;
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.35),
                inset 0 -4px 8px rgba(0,0,0,0.15),
                0 8px 20px rgba(0,0,0,0.4);
            backface-visibility: visible;
            cursor: pointer;
            transition: box-shadow 0.15s ease;
        }

        .crown-cell.selected {
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.35),
                inset 0 -4px 8px rgba(0,0,0,0.15),
                0 0 0 3px rgba(255,255,255,0.9),
                0 0 30px rgba(255,255,255,0.5),
                0 8px 20px rgba(0,0,0,0.4);
        }

        /* Couleurs */
        .color-0 { background: linear-gradient(155deg, #667eea 0%, #764ba2 100%); }
        .color-1 { background: linear-gradient(155deg, #f093fb 0%, #f5576c 100%); }
        .color-2 { background: linear-gradient(155deg, #4facfe 0%, #00f2fe 100%); }
        .color-3 { background: linear-gradient(155deg, #43e97b 0%, #38f9d7 100%); }
        .color-4 { background: linear-gradient(155deg, #fa709a 0%, #fee140 100%); }
        .color-5 { background: linear-gradient(155deg, #e0c3fc 0%, #8ec5fc 100%); }

        .swipe-zone {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .swipe-zone:active {
            cursor: grabbing;
        }

        .hint {
            color: rgba(255,255,255,0.35);
            font-size: 16px;
            letter-spacing: 6px;
            text-transform: uppercase;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scene">
            <div class="cylinder" id="cylinder"></div>
        </div>
        <div class="swipe-zone" id="swipeZone">
            <div class="hint">← SWIPE →</div>
        </div>
    </div>

    <script>
        const FACES = 10;
        const ROWS = 5;
        const COLORS = 6;
        const RADIUS = 140;
        const ANGLE_STEP = 360 / FACES; // 36° par face
        
        const cylinder = document.getElementById('cylinder');
        const swipeZone = document.getElementById('swipeZone');
        
        // Rotation globale et par couronne (en nombre de faces, pas en degrés)
        let globalRotation = 0;
        let crownRotations = [0, 0, 0, 0, 0]; // En degrés pour l'affichage
        let crownOffsets = [0, 0, 0, 0, 0];   // En nombre de faces (après snap)
        
        // Données du cylindre
        const grid = [];
        for (let f = 0; f < FACES; f++) {
            grid[f] = [];
            for (let r = 0; r < ROWS; r++) {
                grid[f][r] = Math.floor(Math.random() * COLORS);
            }
        }

        // Sélection 2×2 (en coordonnées visuelles)
        let selection = null;

        // Double-tap detection
        let lastTapTime = 0;
        let lastTapTarget = null;

        // Drag state
        let isDraggingGlobal = false;
        let isDraggingCrown = false;
        let activeCrown = -1;
        let lastX = 0;
        let dragStartX = 0;
        let hasMoved = false;

        // Position verticale des couronnes
        const crownTops = [20, 123, 226, 329, 432];

        // Convertir face visuelle en face data (tenant compte de la rotation)
        function visualToData(visualFace, row) {
            const offset = crownOffsets[row];
            return ((visualFace - offset) % FACES + FACES) % FACES;
        }

        // Convertir face data en face visuelle
        function dataToVisual(dataFace, row) {
            const offset = crownOffsets[row];
            return ((dataFace + offset) % FACES + FACES) % FACES;
        }

        // Snap to nearest face
        function snapToFace(rotation) {
            const normalized = ((rotation % 360) + 360) % 360;
            const faceIndex = Math.round(normalized / ANGLE_STEP);
            return faceIndex * ANGLE_STEP;
        }

        function snapGlobal() {
            globalRotation = snapToFace(globalRotation);
            updateAllRotations();
        }

        function snapCrown(crownIndex) {
            crownRotations[crownIndex] = snapToFace(crownRotations[crownIndex]);
            // Mettre à jour l'offset en nombre de faces
            crownOffsets[crownIndex] = Math.round(crownRotations[crownIndex] / ANGLE_STEP) % FACES;
            updateAllRotations();
        }

        function buildCylinder() {
            cylinder.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                const crown = document.createElement('div');
                crown.className = 'crown';
                crown.dataset.row = r;
                crown.style.top = crownTops[r] + 'px';

                for (let f = 0; f < FACES; f++) {
                    const cell = document.createElement('div');
                    cell.className = `crown-cell color-${grid[f][r]}`;
                    cell.dataset.face = f;
                    cell.dataset.row = r;
                    
                    const angle = f * ANGLE_STEP;
                    cell.style.transform = `rotateY(${angle}deg) translateZ(${RADIUS}px)`;
                    
                    crown.appendChild(cell);
                }

                cylinder.appendChild(crown);
            }
            updateAllRotations();
        }

        function updateAllRotations() {
            const crowns = document.querySelectorAll('.crown');
            crowns.forEach((crown, index) => {
                const totalRotation = globalRotation + crownRotations[index];
                crown.style.transform = `rotateY(${totalRotation}deg)`;
            });
        }

        function setDragging(crownIndex, isDragging) {
            const crowns = document.querySelectorAll('.crown');
            if (crownIndex === -1) {
                crowns.forEach(crown => {
                    if (isDragging) {
                        crown.classList.add('dragging');
                    } else {
                        crown.classList.remove('dragging');
                    }
                });
            } else {
                if (isDragging) {
                    crowns[crownIndex].classList.add('dragging');
                } else {
                    crowns[crownIndex].classList.remove('dragging');
                }
            }
        }

        function updateCellColors() {
            const cells = document.querySelectorAll('.crown-cell');
            cells.forEach(cell => {
                const f = parseInt(cell.dataset.face);
                const r = parseInt(cell.dataset.row);
                cell.className = cell.className.replace(/color-\d/g, '').trim();
                cell.classList.add(`color-${grid[f][r]}`);
            });
        }

        function updateSelection() {
            const cells = document.querySelectorAll('.crown-cell');
            cells.forEach(cell => cell.classList.remove('selected'));

            if (selection) {
                const {face, row} = selection; // face est en coordonnées DATA
                
                // Les 4 cellules du bloc 2×2 en coordonnées DATA
                const positions = [
                    {f: face, r: row},
                    {f: (face + 1) % FACES, r: row},
                    {f: face, r: row + 1},
                    {f: (face + 1) % FACES, r: row + 1}
                ];

                positions.forEach(pos => {
                    // Trouver la cellule par ses coordonnées DATA
                    const cell = document.querySelector(`.crown-cell[data-face="${pos.f}"][data-row="${pos.r}"]`);
                    if (cell) cell.classList.add('selected');
                });
            }
        }

        function rotate2x2() {
            if (!selection) return;

            const {face, row} = selection;
            const f0 = face;
            const f1 = (face + 1) % FACES;
            const r0 = row;
            const r1 = row + 1;

            const topLeft = grid[f0][r0];
            const topRight = grid[f1][r0];
            const bottomLeft = grid[f0][r1];
            const bottomRight = grid[f1][r1];

            grid[f0][r0] = bottomLeft;
            grid[f1][r0] = topLeft;
            grid[f1][r1] = topRight;
            grid[f0][r1] = bottomRight;

            updateCellColors();
        }

        function handleCellTap(dataFace, row) {
            // Ajuster si on clique sur la dernière rangée
            if (row >= ROWS - 1) {
                row = ROWS - 2;
            }

            // Vérifier que les deux rangées ont le même offset pour un bloc 2×2 cohérent
            // Si non, on sélectionne quand même mais la rotation affectera les données

            const now = Date.now();
            const isDoubleTap = (now - lastTapTime < 350) && 
                               lastTapTarget && 
                               lastTapTarget.face === dataFace && 
                               lastTapTarget.row === row;

            if (isDoubleTap && selection && selection.face === dataFace && selection.row === row) {
                rotate2x2();
                lastTapTime = 0;
                lastTapTarget = null;
            } else {
                selection = {face: dataFace, row: row};
                updateSelection();
                lastTapTime = now;
                lastTapTarget = {face: dataFace, row: row};
            }
        }

        function getCrownFromY(y) {
            const scene = document.querySelector('.scene');
            const rect = scene.getBoundingClientRect();
            const relativeY = y - rect.top;
            
            for (let i = 0; i < ROWS; i++) {
                const crownTop = crownTops[i];
                const crownBottom = crownTop + 90;
                if (relativeY >= crownTop && relativeY <= crownBottom) {
                    return i;
                }
            }
            return -1;
        }

        // === SWIPE ZONE (Global rotation) ===
        swipeZone.addEventListener('touchstart', (e) => {
            isDraggingGlobal = true;
            lastX = e.touches[0].clientX;
            setDragging(-1, true);
        }, { passive: true });

        swipeZone.addEventListener('touchmove', (e) => {
            if (!isDraggingGlobal) return;
            const currentX = e.touches[0].clientX;
            let delta = (currentX - lastX) * 0.3;
            delta = Math.max(-15, Math.min(15, delta));
            globalRotation += delta;
            lastX = currentX;
            updateAllRotations();
        }, { passive: true });

        swipeZone.addEventListener('touchend', () => {
            if (isDraggingGlobal) {
                isDraggingGlobal = false;
                setDragging(-1, false);
                snapGlobal();
            }
        });

        // Mouse pour swipe zone
        swipeZone.addEventListener('mousedown', (e) => {
            isDraggingGlobal = true;
            lastX = e.clientX;
            setDragging(-1, true);
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingGlobal) {
                const currentX = e.clientX;
                let delta = (currentX - lastX) * 0.3;
                delta = Math.max(-15, Math.min(15, delta));
                globalRotation += delta;
                lastX = currentX;
                updateAllRotations();
            }
            if (isDraggingCrown && activeCrown >= 0) {
                const currentX = e.clientX;
                let delta = (currentX - lastX) * 0.3;
                delta = Math.max(-15, Math.min(15, delta));
                crownRotations[activeCrown] += delta;
                lastX = currentX;
                hasMoved = true;
                updateAllRotations();
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (isDraggingGlobal) {
                isDraggingGlobal = false;
                setDragging(-1, false);
                snapGlobal();
            }
            if (isDraggingCrown) {
                if (!hasMoved) {
                    const element = document.elementFromPoint(e.clientX, e.clientY);
                    if (element && element.classList.contains('crown-cell')) {
                        const face = parseInt(element.dataset.face);
                        const row = parseInt(element.dataset.row);
                        handleCellTap(face, row);
                    }
                }
                setDragging(activeCrown, false);
                snapCrown(activeCrown);
                isDraggingCrown = false;
                activeCrown = -1;
                updateSelection(); // Rafraîchir la sélection après snap
            }
        });

        // === SCENE (Crown rotation + tap) ===
        const scene = document.querySelector('.scene');

        scene.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const crown = getCrownFromY(touch.clientY);
            
            if (crown >= 0) {
                isDraggingCrown = true;
                activeCrown = crown;
                lastX = touch.clientX;
                dragStartX = lastX;
                hasMoved = false;
                setDragging(crown, true);
            }
        }, { passive: true });

        scene.addEventListener('touchmove', (e) => {
            if (!isDraggingCrown || activeCrown < 0) return;
            const currentX = e.touches[0].clientX;
            let delta = (currentX - lastX) * 0.3;
            delta = Math.max(-15, Math.min(15, delta));
            
            if (Math.abs(currentX - dragStartX) > 8) {
                hasMoved = true;
            }
            
            crownRotations[activeCrown] += delta;
            lastX = currentX;
            updateAllRotations();
        }, { passive: true });

        scene.addEventListener('touchend', (e) => {
            if (isDraggingCrown) {
                if (!hasMoved && e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    const element = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (element && element.classList.contains('crown-cell')) {
                        const face = parseInt(element.dataset.face);
                        const row = parseInt(element.dataset.row);
                        handleCellTap(face, row);
                    }
                }
                setDragging(activeCrown, false);
                snapCrown(activeCrown);
                isDraggingCrown = false;
                activeCrown = -1;
                updateSelection(); // Rafraîchir la sélection après snap
            }
        });

        scene.addEventListener('mousedown', (e) => {
            const crown = getCrownFromY(e.clientY);
            
            if (crown >= 0) {
                isDraggingCrown = true;
                activeCrown = crown;
                lastX = e.clientX;
                dragStartX = lastX;
                hasMoved = false;
                setDragging(crown, true);
            }
        });

        // Init
        buildCylinder();
    </script>
</body>
</html>
