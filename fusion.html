<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Square - Matrice 5x4 avec Drag</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* ========== MENU DEBUG ========== */
        .debug-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(30, 32, 42, 0.9);
            border: 1px solid rgba(180, 180, 190, 0.3);
            border-radius: 8px;
            color: rgba(180, 180, 190, 0.7);
            font-size: 18px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s;
        }

        .debug-toggle:hover {
            border-color: rgba(180, 180, 190, 0.6);
            color: rgba(220, 220, 230, 0.9);
        }

        .debug-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: rgba(18, 19, 26, 0.98);
            border-left: 1px solid rgba(180, 180, 190, 0.2);
            padding: 20px;
            overflow-y: auto;
            transition: right 0.3s ease;
            z-index: 999;
        }

        .debug-panel.open {
            right: 0;
        }

        .debug-panel h2 {
            color: rgba(180, 180, 190, 0.8);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(180, 180, 190, 0.2);
        }

        .debug-section {
            margin-bottom: 25px;
        }

        .debug-section h3 {
            color: rgba(180, 180, 190, 0.6);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .debug-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .debug-stat {
            background: rgba(40, 42, 54, 0.5);
            border: 1px solid rgba(180, 180, 190, 0.15);
            border-radius: 8px;
            padding: 12px;
        }

        .debug-stat .label {
            color: rgba(180, 180, 190, 0.5);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .debug-stat .value {
            color: rgba(220, 220, 230, 0.9);
            font-size: 1.4rem;
            font-weight: 300;
            margin-top: 4px;
        }

        .debug-textarea {
            width: 100%;
            height: 150px;
            background: rgba(40, 42, 54, 0.5);
            border: 1px solid rgba(180, 180, 190, 0.2);
            border-radius: 8px;
            color: rgba(220, 220, 230, 0.8);
            font-family: inherit;
            font-size: 0.85rem;
            padding: 12px;
            resize: vertical;
        }

        .debug-textarea:focus {
            outline: none;
            border-color: rgba(180, 180, 190, 0.4);
        }

        .debug-textarea::placeholder {
            color: rgba(180, 180, 190, 0.3);
        }

        .debug-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(40, 42, 54, 0.3);
            border: 1px solid rgba(180, 180, 190, 0.15);
            border-radius: 8px;
            padding: 8px;
        }

        .debug-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 4px;
            color: rgba(180, 180, 190, 0.7);
            font-size: 0.8rem;
        }

        .debug-list-item:hover {
            background: rgba(180, 180, 190, 0.1);
        }

        .debug-list-item .index {
            color: rgba(180, 180, 190, 0.4);
            font-size: 0.7rem;
            width: 24px;
        }

        .debug-list-item .preview {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(180, 180, 190, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .debug-list-item .preview svg {
            width: 100%;
            height: 100%;
        }

        .debug-btn {
            background: rgba(40, 42, 54, 0.8);
            border: 1px solid rgba(180, 180, 190, 0.3);
            border-radius: 6px;
            color: rgba(180, 180, 190, 0.7);
            padding: 8px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .debug-btn:hover {
            border-color: rgba(180, 180, 190, 0.6);
            color: rgba(220, 220, 230, 0.9);
        }

        .debug-info {
            color: rgba(180, 180, 190, 0.5);
            font-size: 0.75rem;
            line-height: 1.6;
            margin-top: 10px;
        }

        .debug-grid-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            margin-top: 10px;
        }

        .debug-grid-preview .mini-tile {
            aspect-ratio: 1;
            background: rgba(40, 42, 54, 0.5);
            border: 1px solid rgba(180, 180, 190, 0.2);
            border-radius: 3px;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(180, 180, 190, 0.5);
        }

        .separator-h { border-top: 2px solid rgba(126, 200, 227, 0.5); }
        .separator-v { border-left: 2px solid rgba(255, 215, 0, 0.5); }

        /* ========== GRILLE 5x4 ========== */
        .grid-wrapper {
            position: relative;
            width: 350px; /* 4 * 80 + 3 * 10 = 350px */
            height: 440px; /* 5 * 80 + 4 * 10 = 440px */
            overflow: hidden; /* LE MASQUE MAGIQUE */
        }

        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .square {
            width: 80px;
            height: 80px;
            background-color: #12131a;
            border: 1px solid rgba(180, 180, 190, 0.35);
            border-radius: 14px;
            position: absolute;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .square:hover {
            border-color: rgba(180, 180, 190, 0.55);
        }

        .square.dragging {
            cursor: grabbing;
        }

        .square.ghost {
            pointer-events: none; /* Les clones ne captent pas les événements */
        }

        .square svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        svg .separator {
            stroke: rgba(180, 180, 190, 0.35);
            stroke-width: 1;
        }

        svg line.icon, svg path.icon, svg circle.icon, svg rect.icon, svg polyline.icon {
            stroke: rgba(220, 220, 230, 0.8);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        svg circle.point {
            fill: rgba(220, 220, 230, 0.8);
            stroke: none;
        }

        .square:hover svg line.icon,
        .square:hover svg path.icon,
        .square:hover svg circle.icon,
        .square:hover svg rect.icon,
        .square:hover svg polyline.icon {
            stroke: rgba(255, 255, 255, 0.95);
        }

        .square:hover svg circle.point {
            fill: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>
    <button class="debug-toggle" id="debugToggle">⚙</button>
    
    <div class="debug-panel" id="debugPanel">
        <h2>Debug Panel</h2>
        
        <div class="debug-section">
            <h3>Statistiques</h3>
            <div class="debug-stats">
                <div class="debug-stat">
                    <div class="label">Tuiles</div>
                    <div class="value" id="statTiles">20</div>
                </div>
                <div class="debug-stat">
                    <div class="label">Colonnes</div>
                    <div class="value" id="statCols">4</div>
                </div>
                <div class="debug-stat">
                    <div class="label">Lignes</div>
                    <div class="value" id="statRows">5</div>
                </div>
                <div class="debug-stat">
                    <div class="label">Grille</div>
                    <div class="value" id="statGrid">5×4</div>
                </div>
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Actions</h3>
            <button class="debug-btn" onclick="resetRotations()">Reset Rotations</button>
            <button class="debug-btn" onclick="randomizeRotations()">Rotations Aléatoires</button>
        </div>
        
        <div class="debug-section">
            <h3>Aperçu Grille (5×4)</h3>
            <div class="debug-grid-preview" id="gridPreview"></div>
        </div>
        
        <div class="debug-section">
            <h3>Liste des Tuiles</h3>
            <div class="debug-list" id="tileList"></div>
        </div>
        
        <div class="debug-section">
            <h3>Notes de Design</h3>
            <textarea class="debug-textarea" id="designNotes" placeholder="Vos notes ici..."></textarea>
        </div>
        
        <div class="debug-info">
            <strong>Contrôles:</strong><br>
            • Clic: Rotation 90°<br>
            • Drag H: Déplace la ligne<br>
            • Drag V: Déplace la colonne<br>
            • Wrap-around avec clones fantômes
        </div>
    </div>

    <div class="grid-wrapper">
        <div class="grid-container" id="gridContainer"></div>
    </div>

    <script>
        // ========== CONSTANTES 5x4 ==========
        const COLS = 4;
        const ROWS = 5;
        const CELL_SIZE = 80;
        const CELL_GAP = 10;
        const CELL_TOTAL = CELL_SIZE + CELL_GAP; // 90px
        const GRID_WIDTH = COLS * CELL_TOTAL; // 360px (mais wrapper = 350px pour masquer)
        const GRID_HEIGHT = ROWS * CELL_TOTAL; // 450px (mais wrapper = 440px pour masquer)

        // Données des 20 tuiles (SVG content) - Sélection variée des 50 originales
        const tilesData = [
            // RANGÉE 1
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 12 22 L 22 35 L 32 22"/><path class="icon" d="M 48 58 L 58 45 L 68 58"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><circle class="icon" cx="25" cy="20" r="8"/><circle class="icon" cx="55" cy="20" r="8"/><circle class="icon" cx="40" cy="60" r="8"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 10 55 L 10 40 L 22 40 L 22 25 L 34 25"/><line class="icon" x1="46" y1="55" x2="70" y2="25"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><path class="icon" d="M 10 22 L 22 22 L 30 12 L 38 32 L 46 17 L 54 22 L 70 22"/><line class="icon" x1="10" y1="58" x2="70" y2="58"/></svg>`,
            // RANGÉE 2
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><line class="icon" x1="40" y1="32" x2="40" y2="12"/><path class="icon" d="M 30 22 L 40 12 L 50 22"/><line class="icon" x1="40" y1="68" x2="40" y2="48"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 22 40 L 12 50 L 22 60 L 32 50 Z"/><rect class="icon" x="50" y="30" width="18" height="18" rx="2"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><circle class="icon" cx="40" cy="20" r="10"/><line class="icon" x1="40" y1="30" x2="40" y2="55"/><line class="icon" x1="30" y1="65" x2="50" y2="65"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 12 25 L 32 40 L 12 55"/><circle class="point" cx="58" cy="32" r="3"/><circle class="point" cx="58" cy="48" r="3"/></svg>`,
            // RANGÉE 3
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><path class="icon" d="M 15 20 Q 40 35 65 20"/><path class="icon" d="M 15 60 Q 40 45 65 60"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><line class="icon" x1="22" y1="22" x2="22" y2="58"/><circle class="point" cx="22" cy="22" r="3"/><circle class="point" cx="22" cy="40" r="3"/><circle class="point" cx="22" cy="58" r="3"/><path class="icon" d="M 50 30 L 66 40 L 50 50"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><circle class="icon" cx="40" cy="20" r="8"/><line class="icon" x1="40" y1="28" x2="25" y2="55"/><line class="icon" x1="40" y1="28" x2="55" y2="55"/><line class="icon" x1="25" y1="55" x2="55" y2="55"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 10 30 Q 22 50 34 30"/><path class="icon" d="M 46 50 Q 58 30 70 50"/></svg>`,
            // RANGÉE 4
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><circle class="icon" cx="22" cy="20" r="8"/><circle class="icon" cx="58" cy="20" r="8"/><path class="icon" d="M 30 55 L 40 65 L 50 55 L 40 45 Z"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><line class="icon" x1="10" y1="25" x2="34" y2="25"/><line class="icon" x1="22" y1="25" x2="22" y2="55"/><circle class="point" cx="58" cy="30" r="4"/><circle class="point" cx="58" cy="50" r="4"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><path class="icon" d="M 22 12 L 22 28 L 38 28"/><path class="icon" d="M 58 28 L 58 12 L 42 12"/><path class="icon" d="M 30 55 Q 40 68 50 55"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 22 50 Q 10 35 22 22 Q 34 35 22 50"/><line class="icon" x1="50" y1="30" x2="68" y2="30"/><line class="icon" x1="50" y1="50" x2="68" y2="50"/></svg>`,
            // RANGÉE 5
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><line class="icon" x1="15" y1="20" x2="35" y2="20"/><line class="icon" x1="35" y1="20" x2="35" y2="32"/><line class="icon" x1="45" y1="20" x2="65" y2="20"/><circle class="point" cx="40" cy="60" r="5"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><line class="icon" x1="22" y1="60" x2="22" y2="35"/><line class="icon" x1="22" y1="35" x2="12" y2="22"/><line class="icon" x1="22" y1="35" x2="32" y2="22"/><path class="icon" d="M 50 35 L 60 25 L 70 35"/><path class="icon" d="M 50 55 L 60 45 L 70 55"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="0" y1="40" x2="80" y2="40"/><path class="icon" d="M 12 12 L 12 28 L 28 28"/><path class="icon" d="M 68 12 L 68 28 L 52 28"/><path class="icon" d="M 12 68 L 12 52 L 28 52"/><path class="icon" d="M 68 68 L 68 52 L 52 52"/></svg>`,
            `<svg viewBox="0 0 80 80"><line class="separator" x1="40" y1="0" x2="40" y2="80"/><path class="icon" d="M 28 28 A 14 14 0 1 0 28 52 A 10 10 0 1 1 28 28"/><circle class="point" cx="58" cy="40" r="6"/></svg>`
        ];

        // Matrice logique: grid[row][col] = index de la tuile
        let grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = r * COLS + c;
            }
        }

        // Éléments DOM des tuiles
        let tileElements = [];
        
        // Clones fantômes pour le wrap-around
        let ghostElements = [];

        // Créer les tuiles
        const container = document.getElementById('gridContainer');
        for (let i = 0; i < 20; i++) {
            const tile = document.createElement('div');
            tile.className = 'square';
            tile.innerHTML = tilesData[i];
            tile.dataset.index = i;
            container.appendChild(tile);
            tileElements.push(tile);
        }

        // Positionner les tuiles selon la grille
        function updateAllPositions() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tileIndex = grid[r][c];
                    const tile = tileElements[tileIndex];
                    const x = c * CELL_TOTAL;
                    const y = r * CELL_TOTAL;
                    tile.style.transition = 'none';
                    tile.style.left = x + 'px';
                    tile.style.top = y + 'px';
                }
            }
        }

        // Position initiale
        updateAllPositions();

        // Variables de drag
        let isDragging = false;
        let dragAxis = null; // 'horizontal' ou 'vertical'
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartTime = 0;
        let dragRow = -1;
        let dragCol = -1;
        let dragOffset = 0;
        let initialPositions = [];
        let clickedTile = null;

        // Trouver la position (row, col) d'une tuile
        function findTilePosition(tileIndex) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] === tileIndex) {
                        return { row: r, col: c };
                    }
                }
            }
            return null;
        }

        // Créer les clones fantômes pour une ligne ou colonne
        function createGhosts(axis, rowOrCol) {
            clearGhosts();
            
            if (axis === 'horizontal') {
                // Cloner toute la ligne, décalée à gauche ET à droite
                for (let c = 0; c < COLS; c++) {
                    const tileIndex = grid[rowOrCol][c];
                    const originalTile = tileElements[tileIndex];
                    
                    // Clone gauche (position négative)
                    const ghostLeft = originalTile.cloneNode(true);
                    ghostLeft.className = 'square ghost';
                    ghostLeft.style.left = (c * CELL_TOTAL - GRID_WIDTH) + 'px';
                    ghostLeft.style.top = (rowOrCol * CELL_TOTAL) + 'px';
                    container.appendChild(ghostLeft);
                    ghostElements.push({ el: ghostLeft, baseX: c * CELL_TOTAL - GRID_WIDTH, tileIndex: tileIndex });
                    
                    // Clone droite (position + GRID_WIDTH)
                    const ghostRight = originalTile.cloneNode(true);
                    ghostRight.className = 'square ghost';
                    ghostRight.style.left = (c * CELL_TOTAL + GRID_WIDTH) + 'px';
                    ghostRight.style.top = (rowOrCol * CELL_TOTAL) + 'px';
                    container.appendChild(ghostRight);
                    ghostElements.push({ el: ghostRight, baseX: c * CELL_TOTAL + GRID_WIDTH, tileIndex: tileIndex });
                }
            } else {
                // Cloner toute la colonne, décalée en haut ET en bas
                for (let r = 0; r < ROWS; r++) {
                    const tileIndex = grid[r][rowOrCol];
                    const originalTile = tileElements[tileIndex];
                    
                    // Clone haut (position négative)
                    const ghostTop = originalTile.cloneNode(true);
                    ghostTop.className = 'square ghost';
                    ghostTop.style.left = (rowOrCol * CELL_TOTAL) + 'px';
                    ghostTop.style.top = (r * CELL_TOTAL - GRID_HEIGHT) + 'px';
                    container.appendChild(ghostTop);
                    ghostElements.push({ el: ghostTop, baseY: r * CELL_TOTAL - GRID_HEIGHT, tileIndex: tileIndex });
                    
                    // Clone bas (position + GRID_HEIGHT)
                    const ghostBottom = originalTile.cloneNode(true);
                    ghostBottom.className = 'square ghost';
                    ghostBottom.style.left = (rowOrCol * CELL_TOTAL) + 'px';
                    ghostBottom.style.top = (r * CELL_TOTAL + GRID_HEIGHT) + 'px';
                    container.appendChild(ghostBottom);
                    ghostElements.push({ el: ghostBottom, baseY: r * CELL_TOTAL + GRID_HEIGHT, tileIndex: tileIndex });
                }
            }
        }

        // Supprimer tous les clones fantômes
        function clearGhosts() {
            for (const ghost of ghostElements) {
                ghost.el.remove();
            }
            ghostElements = [];
        }

        // Début du drag
        function startDrag(e) {
            const tile = e.target.closest('.square');
            if (!tile || tile.classList.contains('ghost')) return;

            e.preventDefault();
            
            const tileIndex = parseInt(tile.dataset.index);
            const pos = findTilePosition(tileIndex);
            if (!pos) return;

            isDragging = true;
            dragAxis = null;
            dragRow = pos.row;
            dragCol = pos.col;
            dragOffset = 0;
            clickedTile = tile;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
            dragStartTime = Date.now();

            initialPositions = [];
        }

        // Pendant le drag
        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const deltaX = clientX - dragStartX;
            const deltaY = clientY - dragStartY;

            // Déterminer l'axe au premier mouvement significatif
            if (dragAxis === null) {
                const threshold = 5;
                if (Math.abs(deltaX) > threshold || Math.abs(deltaY) > threshold) {
                    dragAxis = Math.abs(deltaX) > Math.abs(deltaY) ? 'horizontal' : 'vertical';
                    
                    if (dragAxis === 'horizontal') {
                        for (let c = 0; c < COLS; c++) {
                            const tileIndex = grid[dragRow][c];
                            initialPositions.push({
                                tileIndex: tileIndex,
                                baseX: c * CELL_TOTAL
                            });
                        }
                        createGhosts('horizontal', dragRow);
                    } else {
                        for (let r = 0; r < ROWS; r++) {
                            const tileIndex = grid[r][dragCol];
                            initialPositions.push({
                                tileIndex: tileIndex,
                                baseY: r * CELL_TOTAL
                            });
                        }
                        createGhosts('vertical', dragCol);
                    }
                }
            }

            if (dragAxis === null) return;

            // Déplacer les tuiles ET les fantômes
            if (dragAxis === 'horizontal') {
                dragOffset = deltaX;
                
                for (const item of initialPositions) {
                    const tile = tileElements[item.tileIndex];
                    const newX = item.baseX + dragOffset;
                    tile.style.transition = 'none';
                    tile.style.left = newX + 'px';
                }
                
                for (const ghost of ghostElements) {
                    const newX = ghost.baseX + dragOffset;
                    ghost.el.style.transition = 'none';
                    ghost.el.style.left = newX + 'px';
                }
            } else {
                dragOffset = deltaY;
                
                for (const item of initialPositions) {
                    const tile = tileElements[item.tileIndex];
                    const newY = item.baseY + dragOffset;
                    tile.style.transition = 'none';
                    tile.style.top = newY + 'px';
                }
                
                for (const ghost of ghostElements) {
                    const newY = ghost.baseY + dragOffset;
                    ghost.el.style.transition = 'none';
                    ghost.el.style.top = newY + 'px';
                }
            }
        }

        // Rotation d'une tuile
        function rotateTile(tile) {
            let rotation = parseInt(tile.dataset.rotation) || 0;
            rotation += 90;
            tile.dataset.rotation = rotation;
            
            tile.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            tile.style.transform = `rotate(${rotation - 45}deg) scale(0.85)`;
            
            setTimeout(() => {
                tile.style.transform = `rotate(${rotation}deg) scale(1)`;
            }, 200);
        }

        // Fin du drag - snap à la position la plus proche
        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;

            const elapsed = Date.now() - dragStartTime;
            const distance = Math.abs(dragOffset);

            // Si c'est un clic → rotation
            if (distance < 5 && elapsed < 200 && clickedTile) {
                rotateTile(clickedTile);
                clearGhosts();
                clickedTile = null;
                dragAxis = null;
                initialPositions = [];
                return;
            }

            clickedTile = null;

            if (dragAxis === null) {
                clearGhosts();
                return;
            }

            // Calculer le nombre de crans de décalage
            let steps = Math.round(dragOffset / CELL_TOTAL);
            
            if (dragAxis === 'horizontal') {
                for (let i = 0; i < initialPositions.length; i++) {
                    const item = initialPositions[i];
                    const tile = tileElements[item.tileIndex];
                    
                    let currentX = item.baseX + dragOffset;
                    
                    const originalCol = Math.round(item.baseX / CELL_TOTAL);
                    const newCol = ((originalCol + steps) % COLS + COLS) % COLS;
                    const targetX = newCol * CELL_TOTAL;
                    
                    while (currentX - targetX > GRID_WIDTH / 2) currentX -= GRID_WIDTH;
                    while (targetX - currentX > GRID_WIDTH / 2) currentX += GRID_WIDTH;
                    
                    tile.style.transition = 'none';
                    tile.style.left = currentX + 'px';
                }
                
                container.offsetHeight;
                
                for (let i = 0; i < initialPositions.length; i++) {
                    const item = initialPositions[i];
                    const tile = tileElements[item.tileIndex];
                    
                    const originalCol = Math.round(item.baseX / CELL_TOTAL);
                    const newCol = ((originalCol + steps) % COLS + COLS) % COLS;
                    const targetX = newCol * CELL_TOTAL;
                    
                    tile.style.transition = 'left 0.15s ease-out';
                    tile.style.left = targetX + 'px';
                }
                
                // Mettre à jour la grille logique
                const newRow = [];
                for (let c = 0; c < COLS; c++) {
                    const sourceCol = ((c - steps) % COLS + COLS) % COLS;
                    newRow[c] = grid[dragRow][sourceCol];
                }
                grid[dragRow] = newRow;
                
            } else {
                for (let i = 0; i < initialPositions.length; i++) {
                    const item = initialPositions[i];
                    const tile = tileElements[item.tileIndex];
                    
                    let currentY = item.baseY + dragOffset;
                    
                    const originalRow = Math.round(item.baseY / CELL_TOTAL);
                    const newRow = ((originalRow + steps) % ROWS + ROWS) % ROWS;
                    const targetY = newRow * CELL_TOTAL;
                    
                    while (currentY - targetY > GRID_HEIGHT / 2) currentY -= GRID_HEIGHT;
                    while (targetY - currentY > GRID_HEIGHT / 2) currentY += GRID_HEIGHT;
                    
                    tile.style.transition = 'none';
                    tile.style.top = currentY + 'px';
                }
                
                container.offsetHeight;
                
                for (let i = 0; i < initialPositions.length; i++) {
                    const item = initialPositions[i];
                    const tile = tileElements[item.tileIndex];
                    
                    const originalRow = Math.round(item.baseY / CELL_TOTAL);
                    const newRowIdx = ((originalRow + steps) % ROWS + ROWS) % ROWS;
                    const targetY = newRowIdx * CELL_TOTAL;
                    
                    tile.style.transition = 'top 0.15s ease-out';
                    tile.style.top = targetY + 'px';
                }
                
                // Mettre à jour la grille logique
                const newCol = [];
                for (let r = 0; r < ROWS; r++) {
                    const sourceRow = ((r - steps) % ROWS + ROWS) % ROWS;
                    newCol[r] = grid[sourceRow][dragCol];
                }
                for (let r = 0; r < ROWS; r++) {
                    grid[r][dragCol] = newCol[r];
                }
            }

            clearGhosts();
            
            setTimeout(() => {
                updateAllPositions();
            }, 160);

            dragAxis = null;
            initialPositions = [];
        }

        // Event listeners
        container.addEventListener('mousedown', startDrag);
        container.addEventListener('touchstart', startDrag, { passive: false });

        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: false });

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // ========== MENU DEBUG ==========
        const debugToggle = document.getElementById('debugToggle');
        const debugPanel = document.getElementById('debugPanel');
        
        debugToggle.addEventListener('click', () => {
            debugPanel.classList.toggle('open');
        });

        // Analyser les tuiles actuelles
        function analyzeCurrentTiles() {
            updateGridPreview();
            updateTileList();
        }

        // Mettre à jour l'aperçu de la grille
        function updateGridPreview() {
            const preview = document.getElementById('gridPreview');
            preview.innerHTML = '';
            
            for (let i = 0; i < 20; i++) {
                const mini = document.createElement('div');
                mini.className = 'mini-tile';
                
                const svg = tilesData[i];
                if (svg.includes('x1="0" y1="40"')) {
                    mini.classList.add('separator-h');
                    mini.textContent = 'H';
                } else {
                    mini.classList.add('separator-v');
                    mini.textContent = 'V';
                }
                
                preview.appendChild(mini);
            }
        }

        // Mettre à jour la liste des tuiles
        function updateTileList() {
            const list = document.getElementById('tileList');
            list.innerHTML = '';
            
            tilesData.forEach((svg, index) => {
                const item = document.createElement('div');
                item.className = 'debug-list-item';
                
                const sepType = svg.includes('x1="0" y1="40"') ? 'H' : 'V';
                
                item.innerHTML = `
                    <span class="index">#${index + 1}</span>
                    <div class="preview">${svg}</div>
                    <span>Tuile ${index + 1} (${sepType})</span>
                `;
                
                list.appendChild(item);
            });
        }

        // Reset toutes les rotations à 0
        function resetRotations() {
            tileElements.forEach(tile => {
                tile.dataset.rotation = '0';
                tile.style.transform = 'rotate(0deg)';
            });
        }

        // Rotations aléatoires
        function randomizeRotations() {
            tileElements.forEach(tile => {
                const rot = [0, 90, 180, 270][Math.floor(Math.random() * 4)];
                tile.dataset.rotation = rot;
                tile.style.transition = 'transform 0.4s ease';
                tile.style.transform = `rotate(${rot}deg)`;
            });
        }

        // Sauvegarder les notes dans localStorage
        const notesTextarea = document.getElementById('designNotes');
        notesTextarea.value = localStorage.getItem('fusionSquare4ColsNotes') || '';
        notesTextarea.addEventListener('input', () => {
            localStorage.setItem('fusionSquare4ColsNotes', notesTextarea.value);
        });

        // Analyser au chargement
        setTimeout(analyzeCurrentTiles, 100);
    </script>
</body>
</html>
